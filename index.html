<!DOCTYPE html><html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>R.A.W GROUP SHOP</title>
<style>
html, body{height:100%; margin:0; padding:0;}
body{font-family:Arial, sans-serif;background:#eaeef2;box-sizing:border-box;display:flex;flex-direction:column}
*, *:before, *:after{box-sizing:inherit}
#main-shop-view{display:flex;flex-direction:column;min-height:100%;}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:#FF8C00;padding:8px 12px}
.top-bar #google_translate_element{background:#fff;padding:3px 6px;border-radius:15px}
.owner-top img{width:38px;height:38px;border-radius:50%;border:2px solid #FFD700;object-fit:cover}
.header{text-align:center;background:#fff7eb;padding:12px;border-bottom:3px solid #FF8C00}
.header img.logo{width:75px;height:75px;border-radius:15px;border:2px solid #FFD700;object-fit:cover;box-shadow:0 3px 8px rgba(0,0,0,0.15)}
.category-container {background:#fff;border-bottom:2px solid #FF8C00;box-shadow:0 2px 5px rgba(0,0,0,0.05);position:sticky;top:0;z-index:100;}
.category-bar {display:flex;overflow-x:auto;gap:8px;padding:10px 12px;white-space:nowrap;-webkit-overflow-scrolling:touch;align-items:center;}
.category-bar::-webkit-scrollbar{display:none;}
.cat-btn{background:#fff0d4;border:2px solid #FF8C00;color:#b35900;padding:6px 14px;border-radius:15px;font-weight:bold;font-size:12px;cursor:pointer;flex-shrink:0;display:inline-block;text-align:center;}
.cat-btn.active,.cat-btn:hover{background:#FF8C00;color:#fff;}
.search-box{padding:8px 12px;background:#fff;border-bottom:1px solid #ddd;}
.search-box input{width:100%;padding:8px 12px;border:2px solid #FF8C00;border-radius:20px;box-sizing:border-box;text-align:center;font-size:13px;outline:none;}
.products{max-width:600px;margin:0 auto;padding:10px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;flex:1;}
.card{background:#fff;border-radius:4px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,0.08);border:1.5px solid #FF8C00;display:flex;flex-direction:column;cursor:pointer;height:250px;transition:transform 0.2s;position:relative;}
.card:hover{transform:scale(1.01);}
.product-img-container{width:100%;height:130px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1.5px solid #FF8C00;flex-shrink:0;position:relative;}
.product-img-container img{max-width:100%;max-height:100%;object-fit:contain;}
.count-badge{position:absolute;top:5px;right:5px;background:#FF8C00;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:bold;}
.card-body{padding:8px;display:flex;flex-direction:column;justify-content:space-between;height:calc(250px - 130px);}
.product-title{font-size:13px;font-weight:bold;color:#111;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand-name{font-size:11px;color:#b36b00;font-weight:bold;margin:0;}
.price{color:#0a9e00;font-weight:bold;font-size:14px;margin:0;}
.whatsapp-btn{width:100%;background:#25D366;color:#fff;border:none;padding:6px;border-radius:4px;font-weight:bold;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;}
.footer-bar{background:#111;color:#fff;text-align:center;padding:10px;margin-top:auto;font-size:12px;width:100%;}
#product-detail-page{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:2000;overflow-y:auto;box-sizing:border-box;}
.detail-header{display:flex;align-items:center;justify-content:space-between;background:#FF8C00;color:#fff;padding:10px 15px;position:sticky;top:0;z-index:10;}
.back-btn{background:#fff;color:#FF8C00;border:none;padding:5px 12px;border-radius:15px;font-weight:bold;cursor:pointer;font-size:13px;}
.detail-container{max-width:600px;margin:0 auto;padding:15px;display:flex;flex-direction:column;gap:12px;}
/* Detail Slider Unlimited */
.detail-slider{width:100%;height:350px;background:#fff;border:1.5px solid #FF8C00;border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.detail-slider img{max-width:100%;max-height:100%;object-fit:contain;display:none;}
.detail-slider img.active{display:block;}
.dots{text-align:center;margin-top:8px;}
.dots span{display:inline-block;width:8px;height:8px;background:#ccc;border-radius:50%;margin:3px;cursor:pointer;}
.dots span.active{background:#FF8C00;width:20px;border-radius:10px;}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,140,0,0.9);color:#fff;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;}
/* R.A.W AI BUTTON CENTER */
#rawBtn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:82px;height:82px;background:radial-gradient(circle,#FF8C00,#e67a00);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;z-index:999999;box-shadow:0 6px 18px rgba(255,140,0,0.6);border:3px solid white;cursor:grab;touch-action:none;user-select:none}
#rawChat{position:fixed;bottom:115px;left:50%;transform:translateX(-50%);width:360px;max-width:94vw;height:460px;background:white;border-radius:18px;display:none;flex-direction:column;z-index:999999;border:3px solid #FF8C00;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
</style>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}</script>
</head><body>

<div id="main-shop-view">
  <div class="top-bar"><div id="google_translate_element"></div><div class="owner-top"><img src="ejaz.jpg" onerror="this.src='logo.png'"></div></div>
  <div class="header"><img class="logo" src="logo.png" onerror="this.src='https://via.placeholder.com/95'"><h2 style="margin:6px 0 0;color:#FF8C00;font-size:18px;">IJAZ ALI SHOP</h2><p style="margin:2px 0;font-size:12px;color:#555">Best Quality Collection</p></div>
  <div class="category-container"><div class="category-bar" id="categoryBar"><button class="cat-btn active" onclick="filterCategory('All', this)">تمام (All)</button><button class="cat-btn" onclick="filterCategory('Shoes', this)">👟 جوتے</button><button class="cat-btn" onclick="filterCategory('Clothes', this)">👕 کپڑے</button><button class="cat-btn" onclick="filterCategory('Watches', this)">⌚ گھڑیاں</button><button class="cat-btn" onclick="filterCategory('Perfume', this)">🧴 پرفیوم</button><button class="cat-btn" onclick="filterCategory('Mobiles', this)">📱 موبائل</button><button class="cat-btn" onclick="filterCategory('Electronics', this)">⚡ الیکٹرانکس</button><button class="cat-btn" onclick="filterCategory('Toys', this)">🧸 کھلونے</button><button class="cat-btn" onclick="filterCategory('Cosmetics', this)">💄 کاسمیٹکس</button><button class="cat-btn" onclick="filterCategory('Other', this)">📦 دیگر</button></div></div>
  <div class="search-box"><input id="search" onkeyup="filterShop()" placeholder="تلاش کریں... نام یا برانڈ"></div>
  <div id="shopList" class="products"><p style="text-align:center;padding:20px;color:#666;grid-column: span 2;">لوڈ ہو رہا ہے...</p></div>
  <div class="footer-bar">© 2027 R.A.W GROUP - CHUKERA 79</div>
</div>

<div id="product-detail-page"><div class="detail-header"><button class="back-btn" onclick="closeDetailPage()">← Wapas</button><h3 style="margin:0;font-size:15px;">Product Details</h3><div style="width:45px;"></div></div><div class="detail-container" id="detailContent"></div></div>

<!-- R.A.W AI BUTTON -->
<div id="rawBtn"><div style="font-weight:900;font-size:13px">R.A.W</div><div style="background:#fff;color:#FF8C00;font-size:8px;font-weight:bold;padding:2px 6px;border-radius:10px;margin-top:2px">AI GROUP</div></div>
<div id="rawChat"><div style="background:#FF8C00;color:white;padding:12px;font-weight:bold;text-align:center">R.A.W GROUP AI 🤖 <span style="float:left;cursor:pointer" onclick="toggleChat()">✖</span></div><div id="msgs" style="flex:1;padding:10px;overflow-y:auto;background:#fffaf0;color:#111;font-size:13px;text-align:right"><div style="background:white;border:2px solid #FF8C00;padding:9px;border-radius:10px">السلام علیکم اعجاز بھائی! کوئی بھی چیز تلاش کرنی ہے تو بتائیں۔</div></div><div style="display:flex;padding:7px;border-top:2px solid #FF8C00;background:white;gap:5px"><input id="inp" style="flex:1;padding:10px;border:2px solid #FF8C00;border-radius:20px;outline:none" placeholder="لکھیں یا بولیں..."><button onclick="startMic()" style="background:#111;color:white;border:none;width:38px;height:38px;border-radius:50%">🎤</button><button onclick="sendMsg()" style="background:#FF8C00;color:white;border:none;padding:8px 14px;border-radius:18px;font-weight:bold">بھیجیں</button></div></div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs } from "firebase/firestore";
const firebaseConfig = {apiKey:"AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE",authDomain:"raw-group-shop.firebaseapp.com",projectId:"raw-group-shop",storageBucket:"raw-group-shop.firebasestorage.app",messagingSenderId:"488689802066",appId:"1:488689802066:web:1437531e15df63e958388b",measurementId:"G-HNCH9V8MFF"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allProducts = []; let currentCategory = 'All';
async function loadProducts(){try{const snap = await getDocs(collection(db, "products")); allProducts=[]; snap.forEach(doc=>{ allProducts.push({id:doc.id,...doc.data()}); }); render(allProducts);}catch(err){document.getElementById('shopList').innerHTML=`<p style="color:red">ایرر: ${err.message}</p>`;}}
function render(list){let shop=document.getElementById('shopList'); shop.innerHTML=''; if(list.length==0){shop.innerHTML='<p style="text-align:center;grid-column: span 2;">کوئی پروڈکٹ نہیں</p>';return;} list.forEach(p=>{const card=document.createElement('div'); card.className='card'; card.onclick=()=>openDetailPage(p); const imgContainer=document.createElement('div'); imgContainer.className='product-img-container'; let imgSrc='logo.png'; let count=0; if(Array.isArray(p.images)&&p.images.length>0){imgSrc=p.images[0]; count=p.images.length;} else if(typeof p.images==='string'&&p.images.trim()!==''){imgSrc=p.images; count=1;} else if(p.image){imgSrc=p.image; count=1;} const img=document.createElement('img'); img.src=imgSrc; img.onerror=function(){this.src='logo.png';}; imgContainer.appendChild(img); if(count>1){let badge=document.createElement('div'); badge.className='count-badge'; badge.textContent=count+' Pics'; imgContainer.appendChild(badge);} card.appendChild(imgContainer); const body=document.createElement('div'); body.className='card-body'; let title=document.createElement('h3'); title.className='product-title'; title.textContent=p.name||''; body.appendChild(title); if(p.brand){let brand=document.createElement('span'); brand.className='brand-name'; brand.textContent='برانڈ: '+p.brand; body.appendChild(brand);} let price=document.createElement('div'); price.className='price'; price.textContent='Rs '+(p.price||'0'); body.appendChild(price); let btn=document.createElement('button'); btn.className='whatsapp-btn'; btn.textContent='Order on WhatsApp'; btn.onclick=(e)=>{e.stopPropagation(); let t=`اسلام علیکم مجھے یہ چاہیے: ${p.name||''} - Rs ${p.price||''}`; window.open('https://wa.me/923334664227?text='+encodeURIComponent(t));}; body.appendChild(btn); card.appendChild(body); shop.appendChild(card); });}
let curIdx=0, curImgs=[];
window.openDetailPage=function(p){
let detailContent=document.getElementById('detailContent'); detailContent.innerHTML=''; let imgList=[]; if(Array.isArray(p.images)&&p.images.length>0){imgList=p.images;} else if(typeof p.images==='string'&&p.images.trim()!==''){imgList=[p.images];} else if(p.image){imgList=[p.image];} else {imgList=['logo.png'];} curImgs=imgList; curIdx=0;
let slider=document.createElement('div'); slider.className='detail-slider'; slider.id='mainSlider';
imgList.forEach((src,i)=>{let im=document.createElement('img'); im.src=src; im.id='dimg_'+i; if(i==0)im.className='active'; im.onerror=function(){this.src='logo.png';}; slider.appendChild(im);});
if(imgList.length>1){let prev=document.createElement('button'); prev.className='arrow'; prev.style.left='8px'; prev.textContent='‹'; prev.onclick=()=>changeImg(-1); slider.appendChild(prev); let next=document.createElement('button'); next.className='arrow'; next.style.right='8px'; next.textContent='›'; next.onclick=()=>changeImg(1); slider.appendChild(next);}
detailContent.appendChild(slider);
if(imgList.length>1){let dots=document.createElement('div'); dots.className='dots'; dots.id='dotBox'; imgList.forEach((_,i)=>{let d=document.createElement('span'); d.id='dot_'+i; if(i==0)d.className='active'; d.onclick=()=>goImg(i); dots.appendChild(d);}); detailContent.appendChild(dots); let counter=document.createElement('div'); counter.style.textAlign='center'; counter.style.color='#FF8C00'; counter.style.fontSize='12px'; counter.style.fontWeight='bold'; counter.id='counterText'; counter.textContent=`1 / ${imgList.length} - جتنی مرضی تصویریں`; detailContent.appendChild(counter);}
let body=document.createElement('div'); body.className='card-body'; body.style.height='auto'; body.style.background='#fff'; body.style.border='1.5px solid #FF8C00'; body.style.borderRadius='4px'; body.style.padding='12px'; let title=document.createElement('h3'); title.className='product-title'; title.style.fontSize='18px'; title.style.whiteSpace='normal'; title.textContent=p.name||''; body.appendChild(title); if(p.brand){let b=document.createElement('span'); b.className='brand-name'; b.style.fontSize='13px'; b.textContent='برانڈ: '+p.brand; body.appendChild(b);} let price=document.createElement('div'); price.className='price'; price.style.fontSize='18px'; price.textContent='قیمت: Rs '+(p.price||'0'); body.appendChild(price); if(p.desc){let desc=document.createElement('div'); desc.style.display='block'; desc.style.fontSize='14px'; desc.style.background='#fffaf3'; desc.style.padding='10px'; desc.style.borderRadius='4px'; desc.style.border='1px dashed #FF8C00'; desc.style.marginTop='6px'; desc.textContent=p.desc; body.appendChild(desc);} let btn=document.createElement('button'); btn.className='whatsapp-btn'; btn.style.padding='10px'; btn.style.fontSize='14px'; btn.style.marginTop='10px'; btn.textContent='WhatsApp Par Order Karein'; btn.onclick=()=>{let t=`اسلام علیکم مجھے یہ چاہیے: ${p.name||''} - Rs ${p.price||''}`; window.open('https://wa.me/923334664227?text='+encodeURIComponent(t));}; body.appendChild(btn); let amz=document.createElement('a'); amz.href=`https://www.amazon.com/s?k=${encodeURIComponent(p.name||'')}&tag=rawgroup79-20`; amz.target='_blank'; amz.style.display='block'; amz.style.marginTop='8px'; amz.style.background='#FF9900'; amz.style.color='black'; amz.style.padding='10px'; amz.style.textAlign='center'; amz.style.borderRadius='4px'; amz.style.fontWeight='bold'; amz.style.textDecoration='none'; amz.textContent='Amazon پر بھی دیکھیں'; body.appendChild(amz); detailContent.appendChild(body); document.getElementById('main-shop-view').style.display='none'; document.getElementById('product-detail-page').style.display='block'; window.scrollTo(0,0);
}
window.changeImg=function(dir){let total=curImgs.length; let next=(curIdx+dir+total)%total; goImg(next);}
window.goImg=function(idx){document.getElementById('dimg_'+curIdx)?.classList.remove('active'); document.getElementById('dot_'+curIdx)?.classList.remove('active'); curIdx=idx; document.getElementById('dimg_'+curIdx)?.classList.add('active'); document.getElementById('dot_'+curIdx)?.classList.add('active'); let ct=document.getElementById('counterText'); if(ct) ct.textContent=`${curIdx+1} / ${curImgs.length} - جتنی مرضی تصویریں`; }
window.closeDetailPage=function(){document.getElementById('product-detail-page').style.display='none'; document.getElementById('main-shop-view').style.display='block';}
window.filterCategory=function(cat,btn){currentCategory=cat; document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); applyFilters();}
window.filterShop=function(){applyFilters();}
function applyFilters(){let q=document.getElementById('search').value.toLowerCase(); let f=allProducts.filter(p=>{let mc=(currentCategory==='All'||p.category===currentCategory); let ms=((p.name||'')+(p.brand||'')+(p.desc||'')).toLowerCase().includes(q); return mc&&ms;}); render(f);}
loadProducts();
</script>
<script>
// R.A.W AI BUTTON LOGIC
let btn=document.getElementById('rawBtn'), chat=document.getElementById('rawChat'), drag=false, moved=false, sx, sy, sl, st;
function toggleChat(){chat.style.display=chat.style.display==='flex'?'none':'flex';}
btn.addEventListener('mousedown',e=>{drag=true;moved=false;sx=e.clientX;sy=e.clientY;sl=btn.offsetLeft;st=btn.offsetTop;});
document.addEventListener('mousemove',e=>{if(!drag)return;let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;btn.style.left=(sl+dx)+'px';btn.style.top=(st+dy)+'px';btn.style.bottom='auto';btn.style.transform='none';chat.style.left=(sl+dx-140)+'px';chat.style.top=(st+dy-470)+'px';chat.style.bottom='auto';chat.style.transform='none';});
document.addEventListener('mouseup',()=>{if(drag&&!moved)toggleChat();drag=false;});
btn.addEventListener('touchstart',e=>{drag=true;moved=false;sx=e.touches[0].clientX;sy=e.touches[0].clientY;sl=btn.offsetLeft;st=btn.offsetTop;},{passive:false});
document.addEventListener('touchmove',e=>{if(!drag)return;let dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;btn.style.left=(sl+dx)+'px';btn.style.top=(st+dy)+'px';btn.style.bottom='auto';btn.style.transform='none';},{passive:false});
document.addEventListener('touchend',()=>{if(drag&&!moved)toggleChat();drag=false;});
function sendMsg(){let i=document.getElementById('inp'),t=i.value.trim();if(!t)return;let m=document.getElementById('msgs');m.innerHTML+=`<div style="text-align:left;background:#FF8C00;color:white;padding:8px 12px;border-radius:15px 15px 0 15px;margin:8px 0;margin-left:40px">${t}</div>`;i.value='';setTimeout(()=>{m.innerHTML+=`<div style="background:white;border:2px solid #FF8C00;padding:10px;border-radius:15px;margin:8px 0;margin-right:15px">آپ نے "${t}" پوچھا۔ <br><a href="https://www.amazon.com/s?k=${encodeURIComponent(t)}&tag=rawgroup79-20" target="_blank" style="background:#FF9900;color:black;padding:6px 10px;border-radius:6px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:5px">Amazon پر دیکھیں</a></div>`;m.scrollTop=m.scrollHeight;},400);}
function startMic(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Mic support nahi');return;}let r=new SR();r.lang='ur-PK';r.onresult=e=>{document.getElementById('inp').value=e.results[0][0].transcript;sendMsg();};r.start();}
document.getElementById('inp').addEventListener('keypress',e=>{if(e.key==='Enter')sendMsg();});
function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'ur',layout:google.translate.TranslateElement.InlineLayout.SIMPLE},'google_translate_element');}
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
