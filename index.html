<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.A.W GROUP SHOP </title>
<style>
body{margin:0;font-family:Arial;background:#0a0a0a;color:#fff;text-align:center}
.header{background:#111;padding:20px;border-bottom:4px solid #FF6600}
h1{color:#FF6600}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px;padding:15px}
.card{background:#1c1c1c;padding:12px;border-radius:15px;border:1px solid #333}
.price{color:#FF6600;font-weight:bold;font-size:20px}
.btn-order{background:#25D366;color:white;padding:10px 18px;border-radius:25px;text-decoration:none;display:inline-block;font-weight:bold;margin-top:8px}
.amazon-btn{background:#FF9900;color:black;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:5px}

/* Slider */
.slider-box{position:relative;width:100%;height:200px;overflow:hidden;border-radius:12px}
.slider-box img{width:100%;height:100%;object-fit:cover;display:none}
.slider-box img.active{display:block}
.dots{text-align:center;margin-top:6px}
.dots span{display:inline-block;width:8px;height:8px;background:#666;border-radius:50%;margin:2px;cursor:pointer}
.dots span.active{background:#FF6600;width:18px;border-radius:10px}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,102,0,0.9);color:white;border:none;width:28px;height:28px;border-radius:50%}

/* R.A.W AI BUTTON - CENTER */
#rawBtn{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);width:85px;height:85px;background:radial-gradient(circle,#FF6600,#cc5200);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;z-index:999999;box-shadow:0 8px 20px rgba(255,102,0,0.7);border:3px solid white;cursor:grab;touch-action:none;user-select:none}
#rawChat{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);width:360px;max-width:94vw;height:460px;background:white;border-radius:20px;display:none;flex-direction:column;z-index:999999;border:3px solid #FF6600;overflow:hidden}
</style>
</head>
<body>
<div class="header">
<h1>R.A.W GROUP</h1>
<p>IJAZ 2024 | Chukera - Mochh - Mianwali</p>
<a class="btn-order" href="https://wa.me/923334664227">WhatsApp Order Karein</a>
</div>

<div class="shop-grid" id="shop"></div>

<!-- R.A.W AI BUTTON CENTER ME -->
<div id="rawBtn">
<div style="font-weight:900;font-size:14px;letter-spacing:1px">R.A.W</div>
<div style="background:white;color:#FF6600;font-size:9px;font-weight:bold;padding:2px 7px;border-radius:10px;margin-top:3px">AI GROUP</div>
</div>

<div id="rawChat">
<div style="background:#FF6600;color:white;padding:14px;font-weight:bold;text-align:center">R.A.W GROUP AI 🤖 <span style="float:left;cursor:pointer" onclick="toggleChat()">✖</span></div>
<div id="msgs" style="flex:1;padding:12px;overflow-y:auto;background:#fff8f0;color:#111;font-size:14px;text-align:right">
<div style="background:white;border:2px solid #FF6600;padding:10px;border-radius:12px">السلام علیکم! میں R.A.W GROUP AI ہوں۔ کوئی بھی سوال پوچھیں۔</div>
</div>
<div style="display:flex;padding:8px;border-top:2px solid #FF6600;background:white;gap:5px">
<input id="inp" style="flex:1;padding:11px;border:2px solid #FF6600;border-radius:25px;outline:none" placeholder="لکھیں یا بولیں...">
<button onclick="startMic()" style="background:#111;color:white;border:none;width:40px;height:40px;border-radius:50%">🎤</button>
<button onclick="sendMsg()" style="background:#FF6600;color:white;border:none;padding:10px 16px;border-radius:20px;font-weight:bold">بھیجیں</button>
</div>
</div>

<script src="products.js"></script>
<script>
// Products dikhana - unlimited images
let cur={};
function renderProducts(){
let box=document.getElementById('shop');
let html='';
(products || []).forEach(p=>{
let images = p.images || [p.image];
let id = p.id || p.name.replace(/\s/g,'');
let imgs = images.map((src,i)=> `<img src="${src}" class="${i==0?'active':''}" id="img_${id}_${i}">`).join('');
let dots = images.map((_,i)=> `<span onclick="goTo('${id}',${i},${images.length})" id="dot_${id}_${i}" class="${i==0?'active':''}"></span>`).join('');
html+=`<div class="card">
<div class="slider-box">${imgs}
${images.length>1? `<button class="arrow" style="left:5px" onclick="prev('${id}',${images.length})">‹</button><button class="arrow" style="right:5px" onclick="next('${id}',${images.length})">›</button>` : ''}
</div>
${images.length>1? `<div class="dots">${dots} <small style="color:#FF6600">${images.length} Pics</small></div>` : ''}
<h3>${p.name}</h3>
<div class="price">Rs. ${p.price}</div>
<a class="amazon-btn" href="https://www.amazon.com/s?k=${encodeURIComponent(p.name)}&tag=rawgroup79-20" target="_blank">Amazon پر دیکھیں</a>
<a class="btn-order" href="https://wa.me/923334664227?text=${encodeURIComponent(p.name)}" target="_blank">WhatsApp</a>
</div>`;
});
box.innerHTML=html;
}
function goTo(id,idx,total){
for(let i=0;i<total;i++){document.getElementById('img_'+id+'_'+i).classList.remove('active');document.getElementById('dot_'+id+'_'+i).classList.remove('active');}
document.getElementById('img_'+id+'_'+idx).classList.add('active');document.getElementById('dot_'+id+'_'+idx).classList.add('active');cur[id]=idx;
}
function next(id,total){let c=cur[id]||0;goTo(id,(c+1)%total,total);}
function prev(id,total){let c=cur[id]||0;goTo(id,(c-1+total)%total,total);}
setTimeout(renderProducts,500);

// Chat bot - center + draggable + mic
let btn=document.getElementById('rawBtn'), chat=document.getElementById('rawChat'), drag=false, moved=false, sx, sy, sl, st;
function toggleChat(){chat.style.display=chat.style.display==='flex'?'none':'flex';}
btn.addEventListener('mousedown',e=>{drag=true;moved=false;sx=e.clientX;sy=e.clientY;sl=btn.offsetLeft;st=btn.offsetTop;});
document.addEventListener('mousemove',e=>{if(!drag)return;let dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;btn.style.left=(sl+dx)+'px';btn.style.top=(st+dy)+'px';btn.style.bottom='auto';btn.style.transform='none';chat.style.left=(sl+dx)+'px';chat.style.top=(st+dy-470)+'px';chat.style.bottom='auto';chat.style.transform='none';});
document.addEventListener('mouseup',()=>{if(drag&&!moved)toggleChat();drag=false;});
btn.addEventListener('touchstart',e=>{drag=true;moved=false;sx=e.touches[0].clientX;sy=e.touches[0].clientY;sl=btn.offsetLeft;st=btn.offsetTop;},{passive:false});
document.addEventListener('touchmove',e=>{if(!drag)return;let dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;if(Math.abs(dx)>5||Math.abs(dy)>5)moved=true;btn.style.left=(sl+dx)+'px';btn.style.top=(st+dy)+'px';btn.style.bottom='auto';btn.style.transform='none';},{passive:false});
document.addEventListener('touchend',()=>{if(drag&&!moved)toggleChat();drag=false;});
function sendMsg(){let i=document.getElementById('inp'),t=i.value.trim();if(!t)return;let m=document.getElementById('msgs');m.innerHTML+=`<div style="text-align:left;background:#FF6600;color:white;padding:8px 12px;border-radius:15px 15px 0 15px;margin:8px 0;margin-left:40px">${t}</div>`;i.value='';setTimeout(()=>{m.innerHTML+=`<div style="background:white;border:2px solid #FF6600;padding:10px;border-radius:15px;margin:8px 0;margin-right:15px">آپ نے "${t}" پوچھا۔ بہترین ڈیل: <br><a href="https://www.amazon.com/s?k=${encodeURIComponent(t)}&tag=rawgroup79-20" target="_blank" style="background:#FF9900;color:black;padding:6px 10px;border-radius:6px;text-decoration:none;font-weight:bold;display:inline-block;margin-top:5px">Amazon پر دیکھیں</a></div>`;m.scrollTop=m.scrollHeight;},400);}
function startMic(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Mic support nahi');return;}let r=new SR();r.lang='ur-PK';r.onresult=e=>{document.getElementById('inp').value=e.results[0][0].transcript;sendMsg();};r.start();}
document.getElementById('inp').addEventListener('keypress',e=>{if(e.key==='Enter')sendMsg();});
</script>
</body>
</html>
