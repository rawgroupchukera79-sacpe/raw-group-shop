<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.A.W GROUP CHUKERA 79</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
        background: #f8f9fa; /* ہلکا اور خوبصورت سفید پس منظر */
        color: #333;
        text-align: center;
        padding: 0 15px 30px 15px;
    }
    .container {
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        min-height: 100vh;
        box-shadow: 0 0 20px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: C_column;
        align-items: center;
    }
    .logo {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 50%; /* لوگو کو گول کر دیا جو زیادہ ماڈرن لگتا ہے */
        margin-top: 30px;
        border: 4px solid #ff8c00;
        box-shadow: 0 4px 10px rgba(255, 140, 0, 0.3);
    }
    h1 {
        color: #1a1a1a;
        font-size: 28px;
        margin: 15px 0 5px 0;
    }
    .tagline {
        color: #666;
        font-size: 13px;
        letter-spacing: 1px;
        margin-bottom: 15px;
    }
    .menu {
        background: #ff8c00;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 25px;
        padding: 14px 0;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .menu a {
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        font-size: 15px;
        transition: 0.3s;
    }
    .menu a:hover {
        color: #ffeaa7;
    }
    .content-area {
        padding: 40px 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .coming {
        color: #ff8c00;
        font-size: 38px;
        font-weight: 800;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }
    .urdu-text {
        color: #555;
        font-size: 20px;
        margin-bottom: 25px;
        font-weight: 600;
    }
    .btn {
        background: linear-gradient(135deg, #ff8c00, #ffa502);
        color: #fff;
        border: none;
        padding: 14px 45px;
        border-radius: 30px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
        text-decoration: none;
        display: inline-block;
    }
    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 140, 0, 0.6);
    }
</style>
</head>
<body>

<div class="container">
    <img src="logo.png" class="logo" alt="Logo">
    
    <h1>R.A.W. GROUP<br>CHUKERA 79</h1>
    <p class="tagline">Quality | Trust | Excellence</p>
    
    <div class="menu">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="#">Contact</a>
    </div>
    
    <div class="content-area">
        <h2 class="coming">COMING SOON</h2>
        <p class="urdu-text">جلد آرہی ہے</p>
        <a href="shop.html"><button class="btn">GET STARTED</button></a>
    </div>
</div>

</body>
</html>
