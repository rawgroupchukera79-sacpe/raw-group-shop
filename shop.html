<!DOCTYPE html><html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop - R.A.W GROUP CHUKERA 79 | Online Shopping Sargodha</title>
<meta name="description" content="Buy original products from R.A.W Group Chukera 79. Best price in Sargodha, delivery all Pakistan.">
<meta property="og:title" content="Shop - R.A.W GROUP">
<meta property="og:image" content="logo.png">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#fff}.hdr{text-align:center;padding:12px;background:#000;color:#fff}.logo-small{width:60px;border-radius:12px;border:2px solid #FFD700}.line{height:3px;background:#FF9D00}.srch{width:95%;margin:10px auto;display:block;padding:12px;border:1px solid #ccc;border-radius:12px}.brands{display:flex;gap:8px;overflow-x:auto;padding:12px}.brands button{border:1.5px solid #FF9D00;color:#FF9D00;padding:8px 18px;border-radius:20px;background:#fff;font-weight:bold}.brands button.active{background:#FF9D00;color:#fff}.box{padding:15px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:700px;margin:auto}.card{border:1px solid #eee;border-radius:15px;overflow:hidden;text-align:center}.card img{width:100%;height:160px;object-fit:cover}.wa{background:#22C55E;color:#fff;padding:7px 14px;border-radius:20px;text-decoration:none;display:inline-block;margin:8px 0;font-size:12px}</style></head><body>
<div class="hdr"><img src="logo.png" class="logo-small"><h1 style="color:#FF9D00">Ejaz Ali Shop</h1><p style="font-size:11px;color:#ccc">R.A.W GROUP CHUKERA 79</p><div id="google_translate_element" style="margin:8px 0"></div><input id="search" class="srch" placeholder="پروڈکٹ سرچ کریں..." onkeyup="searchP()"></div><div class="line"></div><div class="brands" id="brandBar"></div><div class="box" id="list"></div>
<script>function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'ur',includedLanguages:'en,ur,ar',layout:google.translate.TranslateElement.InlineLayout.SIMPLE},'google_translate_element');}</script><script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script>
let allProducts=JSON.parse(localStorage.getItem('ejaz_products')||'[]');
function makeBrandButtons(){let bar=document.getElementById('brandBar');let brands=[...new Set(allProducts.map(p=>p.brand).filter(b=>b))];bar.innerHTML=`<button class="active" onclick="filterBrand('All',this)">سب</button>`;brands.forEach(b=>{bar.innerHTML+=`<button onclick="filterBrand('${b}',this)">${b}</button>`;});}
function show(d){let b=document.getElementById('list');if(d.length==0){b.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:30px">کوئی پروڈکٹ نہیں</div>`;return;}b.innerHTML='';d.forEach((p)=>{let productNo=allProducts.indexOf(p)+1;let waMsg=`السلام علیکم%0AR.A.W GROUP%0Aپروڈکٹ نمبر: ${productNo}%0Aنام: ${p.name}%0Aبرانڈ: ${p.brand}%0Aقیمت: Rs ${p.price}`;b.innerHTML+=`<div class="card"><div style="background:#FF9D00;color:#fff;font-size:10px;padding:3px">${p.brand}</div><img src="${p.image}"><div style="padding:8px"><b>${p.name}</b><br><b style="color:#FF9D00">Rs ${p.price}</b><br><a class="wa" target="_blank" href="https://wa.me/923334664227?text=${waMsg}">Order</a></div></div>`;});}
function filterBrand(brand,btn){document.querySelectorAll('.brands button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');if(brand==='All')show(allProducts);else show(allProducts.filter(x=>x.brand===brand));}
function searchP(){let v=document.getElementById('search').value.toLowerCase();show(allProducts.filter(x=>x.name.toLowerCase().includes(v)||x.brand.toLowerCase().includes(v)));}
makeBrandButtons();show(allProducts);
</script></body></html>
