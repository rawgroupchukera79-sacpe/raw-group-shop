<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IJAZ ALI - Best Quality Collection</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
<header class="bg-orange-400 p-4 text-center">
<h1 class="text-2xl font-bold text-white">IJAZ ALI</h1>
<p class="text-white">Chakera Bazar - Best Quality Collection</p>
</header>

<div id="products" class="grid grid-cols-2 gap-4 p-4"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB...apni yahan wali key",
  authDomain: "raw-group-shop.firebaseapp.com",
  projectId: "raw-group-shop",
  storageBucket: "raw-group-shop.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadProducts(){
  const querySnapshot = await getDocs(collection(db, "products"));
  let html = "";
  querySnapshot.forEach((doc) => {
    const p = doc.data();
    // yahan fix hai - chahe naam kuch bhi ho undefined nahi ayega
    const name = p.name || p.title || "No Name";
    const price = p.price || p.qeemat || "0";
    const image = p.image || p.img || p.imageUrl || "logo.png";
    
    html += `
    <div class="bg-white rounded-lg shadow p-2">
      <img src="${image}" class="w-full h-40 object-cover rounded">
      <h3 class="font-bold mt-2">${name}</h3>
      <p class="text-green-600 font-bold">Rs ${price}</p>
      <a href="https://wa.me/923...?text=${name}" class="block bg-orange-400 text-white text-center py-2 rounded mt-2">Order on WhatsApp</a>
    </div>`;
  });
  document.getElementById("products").innerHTML = html;
}
loadProducts();
</script>
</body>
</html>
