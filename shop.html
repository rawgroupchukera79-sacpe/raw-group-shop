<!DOCTYPE html><html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IJAZ ALI SHOP</title>
<style>
body{font-family:Arial;margin:0;background:#f9f9f9}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:#FF8C00;padding:8px 10px}
.top-bar #google_translate_element{background:#fff;padding:5px 10px;border-radius:20px}
.owner-top img{width:45px;height:45px;border-radius:50%;border:2px solid #FFD700;object-fit:cover}
.header{text-align:center;background:#fff7eb;padding:12px;border-bottom:4px solid #FF8C00}
.header img.logo{width:95px;border-radius:20px;border:3px solid #FFD700;box-shadow:0 4px 10px #0003}

/* Grid layout for 2 columns */
.products {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px;
}
@media (max-width: 400px) {
  .products {
    grid-template-columns: 1fr;
  }
}

.card {
  background: #fff;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  border: 1px solid #e0e0e0;
}

/* Image Slider Styling */
.image-slider {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  width: 100%;
  height: 160px;
  background: #000;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.image-slider::-webkit-scrollbar {
  display: none;
}
.image-slider img {
  width: 100%;
  height: 160px;
  flex: 0 0 100%;
  object-fit: cover;
  scroll-snap-align: start;
}

.card-body {
  padding: 10px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  flex-grow: 1;
}
.price { color: #0a9e00; font-weight: bold; font-size: 16px; margin: 4px 0; }
.search-box { padding: 10px; background: #fff; position: sticky; top: 0; z-index: 10; }
.search-box input { width: 100%; padding: 12px; border: 2px solid #FF8C00; border-radius: 25px; box-sizing: border-box; text-align: center; }
.product-desc { font-size: 12px; color: #444; margin: 4px 0; white-space: pre-line; }
</style>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}</script>
</head><body>

<div class="top-bar">
<div id="google_translate_element"></div>
<div class="owner-top"><img src="ejaz.jpg" onerror="this.src='logo.png'" title="R.A.W GROUP Owner"></div>
</div>

<div class="header">
<img class="logo" src="logo.png" onerror="this.src='https://via.placeholder.com/95'">
<h2 style="margin:8px 0 0;color:#FF8C00">IJAZ ALI SHOP</h2>
<p style="margin:2px 0;font-size:13px;color:#555">Best Quality Collection</p>
</div>

<div class="search-box"><input id="search" onkeyup="filterShop()" placeholder="تلاش کریں... جوتا، کپڑا، برانڈ"></div>
<div id="shopList" class="products"><p style="grid-column:1/-1;text-align:center;padding:30px">لوڈ ہو رہا ہے...</p></div>

<div style="background:#111;color:#fff;text-align:center;padding:12px;margin-top:30px">© 2027 R.A.W GROUP - CHUKERA 79</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs } from "firebase/firestore";
const firebaseConfig = {
  apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE",
  authDomain: "raw-group-shop.firebaseapp.com",
  projectId: "raw-group-shop",
  storageBucket: "raw-group-shop.firebasestorage.app",
  messagingSenderId: "488689802066",
  appId: "1:488689802066:web:1437531e15df63e958388b",
  measurementId: "G-HNCH9V8MFF"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allProducts = [];

async function loadProducts(){
  try {
    const snap = await getDocs(collection(db, "products"));
    allProducts = [];
    snap.forEach(doc=>{ allProducts.push({id:doc.id, ...doc.data()}); });
    render(allProducts);
  } catch (err) {
    console.error(err);
    document.getElementById('shopList').innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:20px;color:red;background:#fff;border-radius:10px;margin:10px;">ایرر تفصیل: ${err.message}</p>`;
  }
}

function render(list){
 let shop = document.getElementById('shopList');
 shop.innerHTML = '';
 if(list.length == 0){
   shop.innerHTML = '<p style="grid-column:1/-1;text-align:center;padding:30px">ابھی دکان خالی ہے - Admin سے Add کریں</p>';
   return;
 }
 
 list.forEach(p => {
  const card = document.createElement('div');
  card.className = 'card';
  
  const slider = document.createElement('div');
  slider.className = 'image-slider';
  
  let imgList = [];
  if (Array.isArray(p.images) && p.images.length > 0) {
    imgList = p.images;
  } else if (p.image) {
    imgList = [p.image];
  } else {
    imgList = ['logo.png'];
  }

  imgList.forEach(imgSrc => {
    const img = document.createElement('img');
    img.src = imgSrc;
    img.onerror = function() { this.src = 'logo.png'; };
    slider.appendChild(img);
  });
  card.appendChild(slider);

  const body = document.createElement('div');
  body.className = 'card-body';
  
  const contentDiv = document.createElement('div');
  
  const title = document.createElement('b');
  title.textContent = p.name || '';
  contentDiv.appendChild(title);
  
  contentDiv.appendChild(document.createElement('br'));
  
  const brand = document.createElement('small');
  brand.style.color = '#775500';
  brand.textContent = p.brand || '';
  contentDiv.appendChild(brand);
  
  const price = document.createElement('div');
  price.className = 'price';
  price.textContent = 'Rs ' + (p.price || '0');
  contentDiv.appendChild(price);
  
  const desc = document.createElement('div');
  desc.className = 'product-desc';
  desc.textContent = p.desc || '';
  contentDiv.appendChild(desc);
  
  body.appendChild(contentDiv);

  const btn = document.createElement('button');
  btn.textContent = 'Order on WhatsApp';
  btn.style.cssText = 'width:100%;background:#FF8C00;color:#fff;border:none;padding:8px;border-radius:8px;margin-top:8px;font-weight:bold;cursor:pointer;';
  btn.onclick = function() {
    let orderText = `मुझे यह चाहिए: ${p.name || ''} - Rs ${p.price || ''}`;
    window.open('https://wa.me/923334664227?text=' + encodeURIComponent(orderText));
  };
  body.appendChild(btn);

  card.appendChild(body);
  shop.appendChild(card);
 });
}

window.filterShop = function(){
 let q = document.getElementById('search').value.toLowerCase();
 render(allProducts.filter(p => ( (p.name||'') + (p.brand||'') + (p.desc||'') ).toLowerCase().includes(q)));
}
loadProducts();
</script>

<script>
function googleTranslateElementInit(){ 
  new google.translate.TranslateElement({
    pageLanguage: 'ur',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body></html>
