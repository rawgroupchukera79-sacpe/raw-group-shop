<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IJAZ ALI SHOP</title>
<style>
body{margin:0;font-family:sans-serif;background:#fff;padding:10px}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start}
#google_translate_element{border:2px solid orange;padding:5px;border-radius:10px;background:white}
.profile-box{text-align:center;border:2px solid orange;border-radius:12px;padding:8px;background:white;max-width:110px}
.profile-box img{width:60px;height:60px;border-radius:50%;border:2px solid orange;object-fit:cover}
.profile-box b{font-size:12px;display:block;margin-top:4px}
.profile-box small{font-size:11px;display:block;color:#333}
.header{text-align:center;margin-top:5px}
.header img{width:80px;height:80px;border-radius:50%;border:2px solid orange}
.header h2{margin:5px 0}
.search-box{width:100%;padding:12px;margin:12px 0;box-sizing:border-box;border:2px solid orange;border-radius:10px;background:white}
.cat-btns{text-align:center}
.cat-btns button{padding:7px 15px;margin:4px;border:2px solid orange;background:white;border-radius:20px}
.cat-btns button.active{background:orange;color:white}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.card{background:white;border:2px solid orange;border-radius:12px;padding:10px;text-align:center}
.card img{width:100%;height:110px;object-fit:contain}
.price{font-weight:bold;color:green}
.detail{font-size:12px;color:#555;margin:5px 0}
.order-btn{display:block;background:orange;color:white;padding:9px;border-radius:8px;text-decoration:none;margin-top:8px;font-weight:bold}
</style>
</head>
<body>

<div class="top-bar">
<div id="google_translate_element"></div>
<div class="profile-box">
<img src="profile.jpg" onerror="this.src='logo.png'">
<b>اعجاز علی</b>
<small>03334664227</small>
<small>rawgroupchukera79@gmail.com</small>
</div>
</div>

<div class="header">
<img src="logo.png">
<h2>IJAZ ALI SHOP</h2>
</div>

<input type="text" id="search" class="search-box" placeholder="Search / تلاش کریں..." onkeyup="render()">
<div class="cat-btns" id="catBtns"></div>
<div class="products" id="productList"></div>

<script src="products.js"></script>
<script>
let currentCat='All';
function renderCats(){
 let cats=['All',...new Set(products.map(p=>p.category))];
 document.getElementById('catBtns').innerHTML=cats.map(c=>`<button class="${currentCat===c?'active':''}" onclick="currentCat='${c}';render()">${c}</button>`).join('');
}
function render(){
 let s=document.getElementById('search').value.toLowerCase();
 let filtered=products.filter(p=>{
  let matchSearch=p.name.toLowerCase().includes(s) || (p.detail||'').toLowerCase().includes(s);
  let matchCat=(currentCat==='All' || p.category===currentCat);
  return matchSearch && matchCat;
 });
 document.getElementById('productList').innerHTML=filtered.map(p=>`
  <div class="card">
   <img src="${p.image}" onerror="this.src='logo.png'">
   <div><b>${p.name}</b></div>
   <div class="price">${p.price} Rs</div>
   <div class="detail">${p.detail||'تفصیل نہیں لکھی گئی'}</div>
   <a class="order-btn" target="_blank" href="https://wa.me/923334664227?text=${encodeURIComponent('مجھے یہ چاہیے: '+p.name)}">WhatsApp پر آرڈر کریں</a>
  </div>
 `).join('');
 renderCats();
}
function googleTranslateElementInit(){new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:'en,ur,zh-CN,ar,ps',layout:google.translate.TranslateElement.InlineLayout.SIMPLE},'google_translate_element');}
render();
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
