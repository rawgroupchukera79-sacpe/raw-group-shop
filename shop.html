<!DOCTYPE html><html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IJAZ ALI SHOP</title>
<style>
html, body{height:100%; margin:0; padding:0;}
body{font-family:Arial, sans-serif;background:#eaeef2;box-sizing:border-box;display:flex;flex-direction:column}
*, *:before, *:after{box-sizing:inherit}

#main-shop-view{display:flex;flex-direction:column;min-height:100%;}

.top-bar{display:flex;justify-content:space-between;align-items:center;background:#FF8C00;padding:8px 12px}
.top-bar #google_translate_element{background:#fff;padding:3px 6px;border-radius:15px}
.owner-top img{width:38px;height:38px;border-radius:50%;border:2px solid #FFD700;object-fit:cover}

.header{text-align:center;background:#fff7eb;padding:12px;border-bottom:3px solid #FF8C00}
.header img.logo{width:75px;height:75px;border-radius:15px;border:2px solid #FFD700;object-fit:cover;box-shadow:0 3px 8px rgba(0,0,0,0.15)}

/* Category Bar - Bilkul saaf, barabar aur scrollable */
.category-bar {
  display: flex;
  overflow-x: auto;
  gap: 6px;
  padding: 10px;
  background: #fff;
  white-space: nowrap;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  position: sticky;
  top: 0;
  z-index: 100;
  -webkit-overflow-scrolling: touch;
}
.category-bar::-webkit-scrollbar { display: none; }
.cat-btn {
  background: #fff0d4;
  border: 2px solid #FF8C00;
  color: #b35900;
  padding: 6px 14px;
  border-radius: 15px;
  font-weight: bold;
  font-size: 12px;
  cursor: pointer;
  flex-shrink: 0;
  display: inline-block;
  text-align: center;
}
.cat-btn.active, .cat-btn:hover {
  background: #FF8C00;
  color: #fff;
}

.search-box { padding: 8px 12px; background: #fff; }
.search-box input { width: 100%; padding: 8px 12px; border: 2px solid #FF8C00; border-radius: 20px; box-sizing: border-box; text-align: center; font-size: 13px; outline: none; }

/* Products Grid - 2 columns, chauras aur compact */
.products {
  max-width: 600px;
  margin: 0 auto;
  padding: 10px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  width: 100%;
  flex: 1;
}

.card {
  background: #ffffff;
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  border: 1.5px solid #FF8C00;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  height: 250px;
  transition: transform 0.2s;
}
.card:hover { transform: scale(1.01); }

.product-img-container {
  width: 100%;
  height: 130px;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-bottom: 1.5px solid #FF8C00;
  flex-shrink: 0;
}
.product-img-container img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}

.card-body {
  padding: 8px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: calc(250px - 130px);
}

.product-title { font-size: 13px; font-weight: bold; color: #111; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-name { font-size: 11px; color: #b36b00; font-weight: bold; margin: 0; }
.price { color: #0a9e00; font-weight: bold; font-size: 14px; margin: 0; }
.product-desc { display: none; }

.whatsapp-btn {
  width: 100%;
  background: #25D366;
  color: #fff;
  border: none;
  padding: 6px;
  border-radius: 4px;
  font-weight: bold;
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.whatsapp-btn:hover { background: #20ba5a; }

.footer-bar {
  background: #111;
  color: #fff;
  text-align: center;
  padding: 10px;
  margin-top: auto;
  font-size: 12px;
  width: 100%;
}

#product-detail-page {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: #ffffff;
  z-index: 2000;
  overflow-y: auto;
  box-sizing: border-box;
}

.detail-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #FF8C00;
  color: #fff;
  padding: 10px 15px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.back-btn {
  background: #fff;
  color: #FF8C00;
  border: none;
  padding: 5px 12px;
  border-radius: 15px;
  font-weight: bold;
  cursor: pointer;
  font-size: 13px;
}

.detail-container {
  max-width: 600px;
  margin: 0 auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
</style>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}</script>
</head><body>

<div id="main-shop-view">
  <div class="top-bar">
    <div id="google_translate_element"></div>
    <div class="owner-top"><img src="ejaz.jpg" onerror="this.src='logo.png'" title="R.A.W GROUP Owner"></div>
  </div>

  <div class="header">
    <img class="logo" src="logo.png" onerror="this.src='https://via.placeholder.com/95'">
    <h2 style="margin:6px 0 0;color:#FF8C00;font-size:18px;">IJAZ ALI SHOP</h2>
    <p style="margin:2px 0;font-size:12px;color:#555">Best Quality Collection</p>
  </div>

  <div class="category-bar" id="categoryBar">
    <button class="cat-btn active" onclick="filterCategory('All', this)">تمام (All)</button>
    <button class="cat-btn" onclick="filterCategory('Shoes', this)">👟 جوتے</button>
    <button class="cat-btn" onclick="filterCategory('Clothes', this)">👕 کپڑے</button>
    <button class="cat-btn" onclick="filterCategory('Watches', this)">⌚ گھڑیاں</button>
    <button class="cat-btn" onclick="filterCategory('Perfume', this)">🧴 پرفیوم</button>
    <button class="cat-btn" onclick="filterCategory('Mobiles', this)">📱 موبائل</button>
    <button class="cat-btn" onclick="filterCategory('Electronics', this)">⚡ الیکٹرانکس</button>
    <button class="cat-btn" onclick="filterCategory('Toys', this)">🧸 کھلونے</button>
    <button class="cat-btn" onclick="filterCategory('Cosmetics', this)">💄 کاسمیٹکس</button>
    <button class="cat-btn" onclick="filterCategory('Other', this)">📦 دیگر</button>
  </div>

  <div class="search-box">
    <input id="search" onkeyup="filterShop()" placeholder="تلاش کریں... نام یا برانڈ">
  </div>

  <div id="shopList" class="products">
    <p style="text-align:center;padding:20px;color:#666;grid-column: span 2;">لوڈ ہو رہا ہے...</p>
  </div>

  <div class="footer-bar">© 2027 R.A.W GROUP - CHUKERA 79</div>
</div>

<div id="product-detail-page">
  <div class="detail-header">
    <button class="back-btn" onclick="closeDetailPage()">← Wapas</button>
    <h3 style="margin:0;font-size:15px;">Product Details</h3>
    <div style="width: 45px;"></div>
  </div>
  <div class="detail-container" id="detailContent"></div>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs } from "firebase/firestore";
const firebaseConfig = {
  apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE",
  authDomain: "raw-group-shop.firebaseapp.com",
  projectId: "raw-group-shop",
  storageBucket: "raw-group-shop.firebasestorage.app",
  messagingSenderId: "488689802066",
  appId: "1:488689802066:web:1437531e15df63e958388b",
  measurementId: "G-HNCH9V8MFF"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allProducts = [];
let currentCategory = 'All';

async function loadProducts(){
  try {
    const snap = await getDocs(collection(db, "products"));
    allProducts = [];
    snap.forEach(doc=>{ allProducts.push({id:doc.id, ...doc.data()}); });
    render(allProducts);
  } catch (err) {
    console.error(err);
    document.getElementById('shopList').innerHTML = `<p style="text-align:center;padding:20px;color:red;background:#fff;grid-column: span 2;">ایرر تفصیل: ${err.message}</p>`;
  }
}

function render(list){
 let shop = document.getElementById('shopList');
 shop.innerHTML = '';
 if(list.length == 0){
   shop.innerHTML = '<p style="text-align:center;padding:20px;color:#666;grid-column: span 2;">اس کیٹیگری میں کوئی پروڈکٹ موجود نہیں ہے</p>';
   return;
 }
 
 list.forEach(p => {
  const card = document.createElement('div');
  card.className = 'card';
  card.onclick = () => openDetailPage(p);
  
  const imgContainer = document.createElement('div');
  imgContainer.className = 'product-img-container';
  
  let imgSrc = 'logo.png';
  if (Array.isArray(p.images) && p.images.length > 0) {
    imgSrc = p.images[0];
  } else if (typeof p.images === 'string' && p.images.trim() !== '') {
    imgSrc = p.images;
  } else if (p.image) {
    imgSrc = p.image;
  }

  const img = document.createElement('img');
  img.src = imgSrc;
  img.onerror = function() { this.src = 'logo.png'; };
  imgContainer.appendChild(img);
  card.appendChild(imgContainer);

  const body = document.createElement('div');
  body.className = 'card-body';
  
  const title = document.createElement('h3');
  title.className = 'product-title';
  title.textContent = p.name || '';
  body.appendChild(title);
  
  if(p.brand){
    const brand = document.createElement('span');
    brand.className = 'brand-name';
    brand.textContent = 'برانڈ: ' + p.brand;
    body.appendChild(brand);
  }
  
  const price = document.createElement('div');
  price.className = 'price';
  price.textContent = 'Rs ' + (p.price || '0');
  body.appendChild(price);

  const btn = document.createElement('button');
  btn.className = 'whatsapp-btn';
  btn.textContent = 'Order on WhatsApp';
  btn.onclick = (e) => {
    e.stopPropagation();
    let orderText = `मुझे यह चाहिए: ${p.name || ''} - Rs ${p.price || ''}`;
    window.open('https://wa.me/923334664227?text=' + encodeURIComponent(orderText));
  };
  body.appendChild(btn);

  card.appendChild(body);
  shop.appendChild(card);
 });
}

window.openDetailPage = function(p) {
  let detailContent = document.getElementById('detailContent');
  detailContent.innerHTML = '';
  
  let imgList = [];
  if (Array.isArray(p.images) && p.images.length > 0) {
    imgList = p.images;
  } else if (typeof p.images === 'string' && p.images.trim() !== '') {
    imgList = [p.images];
  } else if (p.image) {
    imgList = [p.image];
  } else {
    imgList = ['logo.png'];
  }

  imgList.forEach((imgSrc) => {
    let singleImgBox = document.createElement('div');
    singleImgBox.className = 'product-img-container';
    singleImgBox.style.height = '320px';
    singleImgBox.style.marginBottom = '8px';
    singleImgBox.style.borderRadius = '4px';
    singleImgBox.style.border = '1.5px solid #FF8C00';
    
    let img = document.createElement('img');
    img.src = imgSrc;
    img.onerror = function() { this.src = 'logo.png'; };
    singleImgBox.appendChild(img);
    detailContent.appendChild(singleImgBox);
  });

  let body = document.createElement('div');
  body.className = 'card-body';
  body.style.height = 'auto';
  body.style.background = '#ffffff';
  body.style.border = '1.5px solid #FF8C00';
  body.style.borderRadius = '4px';
  body.style.padding = '12px';
  body.style.boxShadow = '0 3px 10px rgba(0,0,0,0.05)';
  
  let title = document.createElement('h3');
  title.className = 'product-title';
  title.style.fontSize = '18px';
  title.style.whiteSpace = 'normal';
  title.textContent = p.name || '';
  body.appendChild(title);
  
  if(p.brand){
    let brand = document.createElement('span');
    brand.className = 'brand-name';
    brand.style.fontSize = '13px';
    brand.textContent = 'برانڈ: ' + p.brand;
    body.appendChild(brand);
  }
  
  let price = document.createElement('div');
  price.className = 'price';
  price.style.fontSize = '18px';
  price.textContent = 'قیمت: Rs ' + (p.price || '0');
  body.appendChild(price);
  
  if(p.desc){
    let desc = document.createElement('div');
    desc.className = 'product-desc';
    desc.style.display = 'block';
    desc.style.fontSize = '14px';
    desc.style.background = '#fffaf3';
    desc.style.padding = '10px';
    desc.style.borderRadius = '4px';
    desc.style.border = '1px dashed #FF8C00';
    desc.style.marginTop = '6px';
    desc.textContent = p.desc;
    body.appendChild(desc);
  }

  let btn = document.createElement('button');
  btn.className = 'whatsapp-btn';
  btn.style.padding = '10px';
  btn.style.fontSize = '14px';
  btn.style.borderRadius = '4px';
  btn.style.marginTop = '10px';
  btn.textContent = 'WhatsApp Par Order Karein';
  btn.onclick = () => {
    let orderText = `मुझे यह चाहिए: ${p.name || ''} - Rs ${p.price || ''}`;
    window.open('https://wa.me/923334664227?text=' + encodeURIComponent(orderText));
  };
  body.appendChild(btn);

  detailContent.appendChild(body);

  document.getElementById('main-shop-view').style.display = 'none';
  document.getElementById('product-detail-page').style.display = 'block';
  window.scrollTo(0, 0);
}

window.closeDetailPage = function() {
  document.getElementById('product-detail-page').style.display = 'none';
  document.getElementById('main-shop-view').style.display = 'block';
  window.scrollTo(0, 0);
}

window.filterCategory = function(cat, btnElement){
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btnElement.classList.add('active');
  applyFilters();
}

window.filterShop = function(){
  applyFilters();
}

function applyFilters(){
  let q = document.getElementById('search').value.toLowerCase();
  let filtered = allProducts.filter(p => {
    let matchesCat = (currentCategory === 'All' || p.category === currentCategory);
    let matchesSearch = ((p.name||'') + (p.brand||'') + (p.desc||'')).toLowerCase().includes(q);
    return matchesCat && matchesSearch;
  });
  render(filtered);
}

loadProducts();
</script>

<script>
function googleTranslateElementInit(){ 
  new google.translate.TranslateElement({
    pageLanguage: 'ur',
    layout: google.translate.TranslateElement.InlineLayout.SIMPLE
  }, 'google_translate_element');
}
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body></html>
