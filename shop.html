<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IJAZ ALI shop</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

<!-- مکمل اصل ہیڈر لوگو اور تصویر کے ساتھ -->
<div class="bg-[#FF8C00] text-white p-4 shadow-lg">
  <div class="flex items-center justify-between max-w-7xl mx-auto">
    <!-- لوگو -->
    <div class="flex items-center gap-3">
      <img src="logo.png" alt="Logo" class="w-12 h-12 bg-white rounded-full p-1">
      <div>
        <h1 class="text-2xl font-extrabold leading-none">IJAZ ALI</h1>
        <p class="text-xs mt-1">Best Quality Collection</p>
      </div>
    </div>
    <!-- آپ کی تصویر -->
    <div class="flex items-center gap-3">
      <div id="google_translate_element"></div>
      <img src="ijaz.jpg" alt="Ijaz Ali" class="w-12 h-12 rounded-full border-2 border-white object-cover">
    </div>
  </div>
</div>

<!-- ٹرانسلیٹ کے لیے -->
<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'ur', includedLanguages: 'ur,en,ps,ar'}, 'google_translate_element');
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- پروڈکٹس -->
<div id="products" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-4 min-h-[400px] max-w-7xl mx-auto mt-4">
</div>

<div id="status" class="text-center text-gray-400 mt-20">
  یہاں آپ کی پروڈکٹس آئیں گی جب آپ Admin سے Add کریں گے
</div>

<div class="bg-gray-900 text-white text-center py-4 mt-10">
  <p class="text-sm">© 2027 R.A.W GROUP - IJAZ ALI</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "raw-group-shop.firebaseapp.com",
  projectId: "raw-group-shop",
  storageBucket: "raw-group-shop.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
async function loadProducts(){
  const productsDiv = document.getElementById("products");
  const status = document.getElementById("status");
  try{
    const q = query(collection(db, "products"), orderBy("createdAt","desc"));
    const snap = await getDocs(q);
    if(!snap.empty){
      status.style.display = "none";
      snap.forEach(d=>{
        const p = d.data();
        productsDiv.innerHTML += `
          <div class="border bg-white rounded-lg p-2 shadow">
            <img src="${p.image}" class="w-full h-36 object-cover rounded">
            <h3 class="font-bold mt-2">${p.name || ''}</h3>
            <p class="text-orange-500 font-bold">Rs ${p.price || ''}</p>
          </div>`;
      });
    }
  }catch(e){ console.log(e); }
}
loadProducts();
</script>
</body>
</html>
