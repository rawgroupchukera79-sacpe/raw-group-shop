<!DOCTYPE html><html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IJAZ ALI SHOP</title>
<style>
body{font-family:Arial, sans-serif;margin:0;background:#eaeef2;box-sizing:border-box}
*, *:before, *:after{box-sizing:inherit}

.top-bar{display:flex;justify-content:space-between;align-items:center;background:#FF8C00;padding:10px 15px}
.top-bar #google_translate_element{background:#fff;padding:4px 8px;border-radius:20px}
.owner-top img{width:42px;height:42px;border-radius:50%;border:2px solid #FFD700;object-fit:cover}

.header{text-align:center;background:#fff7eb;padding:15px;border-bottom:4px solid #FF8C00}
.header img.logo{width:90px;height:90px;border-radius:20px;border:3px solid #FFD700;object-fit:cover;box-shadow:0 4px 10px rgba(0,0,0,0.15)}

/* Category Filter Bar */
.category-bar {
  display: flex;
  overflow-x: auto;
  gap: 8px;
  padding: 12px;
  background: #fff;
  white-space: nowrap;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  position: sticky;
  top: 0;
  z-index: 100;
}
.category-bar::-webkit-scrollbar { display: none; }
.cat-btn {
  background: #fff0d4;
  border: 2px solid #FF8C00;
  color: #b35900;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.cat-btn.active, .cat-btn:hover {
  background: #FF8C00;
  color: #fff;
}

.search-box { padding: 10px 15px; background: #fff; }
.search-box input { width: 100%; padding: 10px 15px; border: 2px solid #FF8C00; border-radius: 25px; box-sizing: border-box; text-align: center; font-size: 14px; outline: none; }

/* Products Grid Layout */
.products {
  max-width: 600px;
  margin: 0 auto;
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.card {
  background: #ffffff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  border: 2px solid #FF8C00;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: transform 0.2s;
}
.card:hover { transform: scale(1.01); }

.image-slider {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  width: 100%;
  height: 220px;
  background: #222;
  -webkit-overflow-scrolling: touch;
}
.image-slider::-webkit-scrollbar { height: 6px; }
.image-slider::-webkit-scrollbar-thumb { background: #FF8C00; border-radius: 10px; }
.image-slider img {
  width: 100%;
  height: 220px;
  flex: 0 0 100%;
  object-fit: cover;
  scroll-snap-align: start;
}

.card-body {
  padding: 15px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.product-title { font-size: 18px; font-weight: bold; color: #111; margin: 0; }
.brand-name { font-size: 14px; color: #b36b00; font-weight: bold; }
.price { color: #0a9e00; font-weight: bold; font-size: 19px; }
.product-desc { font-size: 14px; color: #444; white-space: pre-line; line-height: 1.5; background: #fffaf3; padding: 10px; border-radius: 8px; border: 1px dashed #FF8C00; }

.whatsapp-btn {
  width: 100%;
  background: #25D366;
  color: #fff;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 5px;
}
.whatsapp-btn:hover { background: #20ba5a; }

/* Full-Screen Zoom Modal (Jab product par touch kiya jaye) */
#modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 15px;
  box-sizing: border-box;
}
.modal-content {
  background: #fff;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  border-radius: 18px;
  overflow-y: auto;
  border: 3px solid #FF8C00;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  position: relative;
  display: flex;
  flex-direction: column;
}
.close-modal {
  position: absolute;
  top: 10px;
  right: 15px;
  background: #ff1a1a;
  color: #fff;
  border: none;
  width: 35px; height: 35px;
  border-radius: 50%;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
}
</style>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"}}</script>
</head><body>

<div class="top-bar">
<div id="google_translate_element"></div>
<div class="owner-top"><img src="ejaz.jpg" onerror="this.src='logo.png'" title="R.A.W GROUP Owner"></div>
</div>

<div class="header">
<img class="logo" src="logo.png" onerror="this.src='https://via.placeholder.com/95'">
<h2 style="margin:8px 0 0;color:#FF8C00">IJAZ ALI SHOP</h2>
<p style="margin:2px 0;font-size:13px;color:#555">Best Quality Collection</p>
</div>

<!-- Category Bar -->
<div class="category-bar" id="categoryBar">
  <button class="cat-btn active" onclick="filterCategory('All', this)">تمام (All)</button>
  <button class="cat-btn" onclick="filterCategory('Shoes', this)">👟 جوتے</button>
  <button class="cat-btn" onclick="filterCategory('Clothes', this)">👕 کپڑے</button>
  <button class="cat-btn" onclick="filterCategory('Watches', this)">⌚ گھڑیاں</button>
  <button class="cat-btn" onclick="filterCategory('Perfume', this)">🧴 پرفیوم</button>
  <button class="cat-btn" onclick="filterCategory('Other', this)">📦 دیگر</button>
</div>

<div class="search-box">
  <input id="search" onkeyup="filterShop()" placeholder="تلاش کریں... نام یا برانڈ">
</div>

<div id="shopList" class="products">
  <p style="text-align:center;padding:30px;color:#666;">لوڈ ہو رہا ہے...</p>
</div>

<!-- Zoom Modal Overlay -->
<div id="modal-overlay" onclick="closeProductModal(event)">
  <div class="modal-content" id="modalContent" onclick="event.stopPropagation()">
    <button class="close-modal" onclick="closeProductModalDirect()">×</button>
    <div id="modalBody"></div>
  </div>
</div>

<div style="background:#111;color:#fff;text-align:center;padding:15px;margin-top:30px;font-size:13px;">© 2027 R.A.W GROUP - CHUKERA 79</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getFirestore, collection, getDocs } from "firebase/firestore";
const firebaseConfig = {
  apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE",
  authDomain: "raw-group-shop.firebaseapp.com",
  projectId: "raw-group-shop",
  storageBucket: "raw-group-shop.firebasestorage.app",
  messagingSenderId: "488689802066",
  appId: "1:488689802066:web:1437531e15df63e958388b",
  measurementId: "G-HNCH9V8MFF"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let allProducts = [];
let currentCategory = 'All';

async function loadProducts(){
  try {
    const snap = await getDocs(collection(db, "products"));
    allProducts = [];
    snap.forEach(doc=>{ allProducts.push({id:doc.id, ...doc.data()}); });
    render(allProducts);
  } catch (err) {
    console.error(err);
    document.getElementById('shopList').innerHTML = `<p style="text-align:center;padding:20px;color:red;background:#fff;border-radius:10px;">ایرر تفصیل: ${err.message}</p>`;
  }
}

function render(list){
 let shop = document.getElementById('shopList');
 shop.innerHTML = '';
 if(list.length == 0){
   shop.innerHTML = '<p style="text-align:center;padding:30px;color:#666;">اس کیٹیگری میں کوئی پروڈکٹ موجود نہیں ہے</p>';
   return;
 }
 
 list.forEach(p => {
  const card = document.createElement('div');
  card.className = 'card';
  card.onclick = () => openProductModal(p);
  
  const slider = document.createElement('div');
  slider.className = 'image-slider';
  
  let imgList = [];
  if (Array.isArray(p.images) && p.images.length > 0) {
    imgList = p.images;
  } else if (typeof p.images === 'string' && p.images.trim() !== '') {
    imgList = [p.images];
  } else if (p.image) {
    imgList = [p.image];
  } else {
    imgList = ['logo.png'];
  }

  imgList.forEach(imgSrc => {
    const img = document.createElement('img');
    img.src = imgSrc;
    img.onerror = function() { this.src = 'logo.png'; };
    slider.appendChild(img);
  });
  card.appendChild(slider);

  const body = document.createElement('div');
  body.className = 'card-body';
  
  const title = document.createElement('h3');
  title.className = 'product-title';
  title.textContent = p.name || '';
  body.appendChild(title);
  
  if(p.brand){
    const brand = document.createElement('span');
    brand.className = 'brand-name';
    brand.textContent = 'برانڈ: ' + p.brand;
    body.appendChild(brand);
  }
  
  const price = document.createElement('div');
  price.className = 'price';
  price.textContent = 'قیمت: Rs ' + (p.price || '0');
  body.appendChild(price);

  const btn = document.createElement('button');
  btn.className = 'whatsapp-btn';
  btn.textContent = 'WhatsApp Par Order Karein';
  btn.onclick = (e) => {
    e.stopPropagation();
    let orderText = `मुझे यह चाहिए: ${p.name || ''} - Rs ${p.price || ''}`;
    window.open('https://wa.me/923334664227?text=' + encodeURIComponent(orderText));
  };
  body.appendChild(btn);

  card.appendChild(body);
  shop.appendChild(card);
 });
}

window.openProductModal = function(p) {
  let modalBody = document.getElementById('modalBody');
  modalBody.innerHTML = '';
  
  let slider = document.createElement('div');
  slider.className = 'image-slider';
  slider.style.height = '280px';
  
  let imgList = [];
  if (Array.isArray(p.images) && p.images.length > 0) {
    imgList = p.images;
  } else if (typeof p.images === 'string' && p.images.trim() !== '') {
    imgList = [p.images];
  } else if (p.image) {
    imgList = [p.image];
  } else {
    imgList = ['logo.png'];
  }

  imgList.forEach(imgSrc => {
    let img = document.createElement('img');
    img.src = imgSrc;
    img.style.height = '280px';
    slider.appendChild(img);
  });
  modalBody.appendChild(slider);

  let body = document.createElement('div');
  body.className = 'card-body';
  
  let title = document.createElement('h3');
  title.className = 'product-title';
  title.style.fontSize = '22px';
  title.textContent = p.name || '';
  body.appendChild(title);
  
  if(p.brand){
    let brand = document.createElement('span');
    brand.className = 'brand-name';
    brand.textContent = 'برانڈ: ' + p.brand;
    body.appendChild(brand);
  }
  
  let price = document.createElement('div');
  price.className = 'price';
  price.style.fontSize = '22px';
  price.textContent = 'قیمت: Rs ' + (p.price || '0');
  body.appendChild(price);
  
  if(p.desc){
    let desc = document.createElement('div');
    desc.className = 'product-desc';
    desc.style.fontSize = '15px';
    desc.textContent = p.desc;
    body.appendChild(desc);
  }

  let btn = document.createElement('button');
  btn.className = 'whatsapp-btn';
  btn.style.padding = '14px';
  btn.style.fontSize = '16px';
  btn.textContent = 'WhatsApp Par Order Karein';
  btn.onclick = () => {
    let orderText = `मुझे यह चाहिए: ${p.name || ''} - Rs ${p.price || ''}`;
    window.open('https://wa.me/923334664227?text=' + encodeURIComponent(orderText));
  };
  body.appendChild(btn);

  modalBody.appendChild(body);
  document.getElementById('modal-overlay').style.display = 'flex';
}

window.closeProductModal = function(e) {
  document.getElementById('modal-overlay').style.display = 'none';
}

window.closeProductModalDirect = function() {
  document.getElementById('modal-overlay').style.display = 'none';
}

window.filterCategory = function(cat, btnElement){
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btnElement.classList.add('active');
  applyFilters();
}

window.filterShop = function(){
  applyFilters();
}

function applyFilters(){
  let q = document.getElementById('search').value.toLowerCase();
  let filtered = allProducts.filter(p => {
    let matchesCat = (currentCategory === 'All' || p.category === currentCategory);
    let matchesSearch = ((p.name||'') + (p.brand||'') + (p.desc||'')).toLowerCase().includes(q);
    return matchesCat && matchesSearch;
  });
  render(filtered);
}

loadProducts();
</script>
</body></html>
