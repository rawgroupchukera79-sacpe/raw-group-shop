<!DOCTYPE html><html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R.A.W GROUP CHAKERA</title>
<style>
body{font-family:Arial;margin:0;background:#f9f9f9}
.top-bar{display:flex;justify-content:space-between;align-items:center;background:#FF8C00;padding:8px 10px}
.top-bar #google_translate_element{background:#fff;padding:5px 10px;border-radius:20px}
.owner-top img{width:45px;height:45px;border-radius:50%;border:2px solid #FFD700;object-fit:cover}
.header{text-align:center;background:#fff7eb;padding:12px;border-bottom:4px solid #FF8C00}
.header img.logo{width:95px;border-radius:20px;border:3px solid #FFD700;box-shadow:0 4px 10px #0003}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 8px #0002}
.card img{width:100%;height:180px;object-fit:cover}
.card-body{padding:10px}
.price{color:#0a9e00;font-weight:bold;font-size:18px}
.search-box{padding:10px;background:#fff}
.search-box input{width:100%;padding:13px;border:2px solid #FF8C00;border-radius:25px;box-sizing:border-box;text-align:center}
</style>
</head><body>

<!-- اوپر والا بار: ایک کونے میں ٹرانسلیٹر، دوسرے میں آپ کی تصویر -->
<div class="top-bar">
<div id="google_translate_element"></div>
<div class="owner-top"><img src="ejaz.jpg" onerror="this.src='logo.png'" title="R.A.W GROUP Owner"></div>
</div>

<div class="header">
<img class="logo" src="logo.png" onerror="this.src='https://via.placeholder.com/95'">
<h2 style="margin:8px 0 0;color:#FF8C00">R.A.W GROUP CHAKERA</h2>
<p style="margin:2px 0;font-size:13px;color:#555">Chakera Bazar - Best Quality Collection</p>
</div>

<div class="search-box"><input id="search" onkeyup="filterShop()" placeholder="تلاش کریں... جوتا، کپڑا، برانڈ"></div>

<div id="shopList" class="products"></div>

<script>
function googleTranslateElementInit(){
 new google.translate.TranslateElement({pageLanguage:'ur',includedLanguages:'en,ur,ar,zh-CN,hi,tr,es,fr,de,ru,bn,fa',layout:google.translate.TranslateElement.InlineLayout.SIMPLE},'google_translate_element');
}
let products=JSON.parse(localStorage.getItem('ejaz_products')||'[]');
let all=[...products];
function render(list){
 let shop=document.getElementById('shopList'); shop.innerHTML='';
 if(list.length==0){shop.innerHTML='<p style="grid-column:1/3;text-align:center;padding:30px">ابھی دکان خالی ہے</p>';return;}
 list.forEach(p=>{
  shop.innerHTML+=`<div class="card"><img src="${p.image}"><div class="card-body"><b>${p.name}</b><br><small>${p.brand}</small><div class="price">Rs ${p.price}</div><small>${p.desc}</small><br><button onclick="window.open('https://wa.me/923334664227?text=${encodeURIComponent('مجھے یہ چاہیے: '+p.name)}')" style="width:100%;background:#FF8C00;color:#fff;border:none;padding:8px;border-radius:8px;margin-top:6px;font-weight:bold">Order on WhatsApp</button></div></div>`;
 });
}
function filterShop(){
 let q=document.getElementById('search').value.toLowerCase();
 render(all.filter(p=>(p.name+p.brand+p.desc).toLowerCase().includes(q)));
}
render(all);
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body></html>
