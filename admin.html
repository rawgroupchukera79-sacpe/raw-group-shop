<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.A.W GROUP - Secure Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
:root{ --orange:#FF8C00; }
body{background:#f5f5f5; font-family:'Poppins', 'Noto Nastaliq Urdu', sans-serif; margin:0; padding:10px;}
.box{max-width:600px; margin:15px auto; background:white; border:3px solid var(--orange); border-radius:18px; padding:18px; overflow:hidden; position:relative;}
.logo-box{width:90px; height:90px; margin:0 auto 10px auto; border:3px solid var(--orange); border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:white;}
.logo-box img{width:100%; height:100%; object-fit:cover;}
h1{color:var(--orange); text-align:center; font-size:20px; margin:5px 0;}
input,select,textarea{width:100%; padding:10px; margin:5px 0; border:2px solid var(--orange); border-radius:8px; font-size:15px; display:block; font-family:inherit;}
.price-row{display:flex; gap:6px; margin:5px 0;}
.price-row select{width:110px;}
.price-row input{flex:1; margin:0;}
.btn-add{width:100%; padding:12px; background:var(--orange); color:white; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer;}
.btn-live{background:#194376; color:white; border:none; padding:8px 12px; border-radius:6px; font-weight:bold; font-size:12px; cursor:pointer; width:100%; margin-bottom:6px;}
.btn-logout{position:absolute; top:10px; left:10px; background:#ff1a1a; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-weight:bold; font-size:12px;}
#status{text-align:center; color:green; border:1px dashed var(--orange); padding:6px; border-radius:6px; font-weight:bold; margin:6px 0; font-size:13px;}
#preview-container{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; justify-content:center;}
#preview-container img{width:60px; height:60px; object-fit:cover; border-radius:6px; border:2px solid var(--orange);}
.seller-group-card{border:2px solid #2e7d32; background:#e8f5e9; border-radius:12px; padding:12px; margin-bottom:15px;}
.product-item{display:flex; gap:8px; align-items:center; border:2px solid var(--orange); border-radius:10px; padding:8px; margin-bottom:8px; background:#fff; width:100%;}
.product-item img{width:50px; height:50px; object-fit:cover; border-radius:6px; flex-shrink:0;}
.p-info{flex:1; text-align:right; font-size:12px; overflow:hidden;}
.btn-edit{background:var(--orange); color:white; border:none; padding:5px 8px; border-radius:4px; margin:2px; cursor:pointer; font-size:11px;}
.btn-del{background:#ff1a1a; color:white; border:none; padding:5px 8px; border-radius:4px; margin:2px; cursor:pointer; font-size:11px;}
.order-card{border:2px solid #194376; background:#eef2f7; border-radius:10px; padding:10px; margin-bottom:10px; font-size:12px;}
.profit-badge{background:#28a745; color:white; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:11px;}
.btn-release{background:#28a745; color:white; border:none; padding:6px; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:4px; width:48%; font-size:11px;}
.btn-hold{background:#d9534f; color:white; border:none; padding:6px; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:4px; width:48%; font-size:11px;}
.contact-action-btn{display:inline-block; background:#194376; color:white; padding:3px 8px; border-radius:5px; text-decoration:none; font-weight:bold; margin-top:3px; font-size:11px; margin-left:4px;}
.whatsapp-action-btn{display:inline-block; background:#25d366; color:white; padding:3px 8px; border-radius:5px; text-decoration:none; font-weight:bold; margin-top:3px; font-size:11px;}
</style>

  <div style="background:#fff3ec; border:2px dashed #f57224; padding:8px; border-radius:8px; margin-bottom:12px;">
    <h3 style="color:#194376; font-size:13px; text-align:center; margin-bottom:6px;">🛡️ Escrow Orders Manager (محفوظ آرڈرز لسٹ)</h3>
    <div id="ordersList" style="text-align:right;">لوڈ ہو رہا ہے...</div>
  </div>

  <hr style="margin:12px 0; border:1px dashed #FF8C00;">
  <h3 style="color:#194376; font-size:14px; text-align:center;">📦 سیلر وائز پروڈکٹس مینیجر (Seller-wise Products):</h3>

</div>

<script>
const CORRECT_PASS="1234";
const loginBox=document.getElementById('loginBox'), adminPanel=document.getElementById('adminPanel');
function doLogin(){ 
  let p=document.getElementById('adminPass').value.trim(); 
  if(p===CORRECT_PASS){
    sessionStorage.setItem('raw_logged_in','true'); 
    loginBox.style.display='none'; 
    adminPanel.style.display='block';
    if(window.loadProductsFromFirebase) window.loadProductsFromFirebase();
    if(window.loadOrdersFromFirebase) window.loadOrdersFromFirebase();
  } else {
    document.getElementById('loginError').innerText='غلط پاس ورڈ! 1234 لکھیں';
  } 
}
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('adminPass').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('logoutBtn').addEventListener('click',()=>{
  sessionStorage.removeItem('raw_logged_in'); 
  adminPanel.style.display='none'; 
  loginBox.style.display='block';
});
if(sessionStorage.getItem('raw_logged_in')==='true'){loginBox.style.display='none'; adminPanel.style.display='block';}

let currencyRates = { USD: 280, AED: 76, GBP: 350, EUR: 300 };

async function fetchLiveExchangeRates(showAlert = false) {
  try {
    let res = await fetch('https://open.er-api.com/v6/latest/USD');
    let data = await res.json();
    if(data && data.rates && data.rates.PKR) {
      let usdToPkr = data.rates.PKR;
      currencyRates.USD = usdToPkr;
      currencyRates.AED = usdToPkr / 3.67;
      if(data.rates.GBP) currencyRates.GBP = usdToPkr / data.rates.GBP;
      if(data.rates.EUR) currencyRates.EUR = usdToPkr / data.rates.EUR;
      updateRateInputs();
      convertLiveCurrency();
      if(showAlert) alert("لائیو ریٹس کامیابی سے اپ ڈیٹ ہو گئے ہیں! ✅ (1 USD = " + Math.round(usdToPkr) + " PKR)");
    }
  } catch(err) {
    if(showAlert) alert("لائیو ریٹ حاصل کرنے میں مسئلہ ہوا۔ آپ خود مینول ریٹ درج کر سکتے ہیں۔");
    updateRateInputs();
  }
}
fetchLiveExchangeRates(false);

window.updateRateInputs = function() {
  let curr = document.getElementById('adCurrency').value;
  let manualBox = document.getElementById('manualRateBox');
  let rateInput = document.getElementById('customRateInput');
  let label = document.getElementById('rateLabel');

  if(curr === 'Rs.') {
    manualBox.style.display = 'none';
  } else {
    manualBox.style.display = 'block';
    label.innerText = `1 ${curr} کا ریٹ (لائیو یا اپنی مرضی سے سیٹ کریں):`;
    if(!rateInput.value || rateInput.value == "280") {
      rateInput.value = Math.round(currencyRates[curr] || 280);
    }
  }
};

window.convertLiveCurrency = function() {
  let curr = document.getElementById('adCurrency').value;
  let val = Number(document.getElementById('priceDirectPKR').value) || 0;
  let noteDiv = document.getElementById('liveRateNote');
  let customRate = Number(document.getElementById('customRateInput').value) || currencyRates[curr] || 280;
  
  if(curr === 'Rs.') {
    noteDiv.innerText = `🇵🇰 قیمت پاکستانی روپے (PKR) میں درج ہے۔`;
  } else {
    let convertedPKR = Math.round(val * customRate);
    noteDiv.innerText = `💱 قیمت کی کیلکولیشن: Rs. ${convertedPKR.toLocaleString()} (لائیو/مقررہ ریٹ: 1 ${curr} = ${customRate} PKR)`;
  }
};
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE", authDomain: "raw-group-shop.firebaseapp.com", projectId: "raw-group-shop", storageBucket: "raw-group-shop.firebasestorage.app", messagingSenderId: "488689802066", appId: "1:488689802066:web:1437531e15df63e958388b" };
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);

let editingId = null, existingImagesForEdit = [], selectedFiles = [];
let allProductsCache = [];

async function compressAndResize(f) {
  const size = 400;
  let source, w, h, cleanup = () => {};
  try {
    if (window.createImageBitmap) {
      const bmp = await createImageBitmap(f);
      source = bmp; w = bmp.width; h = bmp.height;
      cleanup = () => bmp.close && bmp.close();
    } else { throw new Error('fallback'); }
  } catch (_) {
    const url = URL.createObjectURL(f);
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error('تصویر نہیں کھل سکی'));
      img.src = url;
    });
    source = img; w = img.naturalWidth; h = img.naturalHeight;
    cleanup = () => URL.revokeObjectURL(url);
  }
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const min = Math.min(w, h);
  ctx.drawImage(source, (w - min) / 2, (h - min) / 2, min, min, 0, 0, size, size);
  cleanup();
  return canvas.toDataURL('image/jpeg', 0.6);
}

const status = document.getElementById('status'), sellerWiseListDiv = document.getElementById('sellerWiseProductList'), previewContainer = document.getElementById('preview-container'), addBtn = document.getElementById('addBtn'), cancelEditBtn = document.getElementById('cancelEditBtn');

document.getElementById('imageFile').onchange = e => {
  selectedFiles = Array.from(e.target.files).slice(0, 5);
  previewContainer.innerHTML = '';
  selectedFiles.forEach(f => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    previewContainer.appendChild(img);
  });
  status.innerText = selectedFiles.length + ' تصاویر منتخب ہیں ✅';
};

addBtn.onclick = async () => { 
  const name = document.getElementById('name').value.trim(); 
  const category = document.getElementById('category').value;
  const price = document.getElementById('priceDirectPKR').value;
  const currency = document.getElementById('adCurrency').value;

  if(!name){ alert('پروڈکٹ کا نام لکھیں'); return; } 
  if(!category){ alert('کیٹیگری منتخب کریں'); return; }
  if(!price){ alert('قیمت لکھیں'); return; }
  if(!editingId && selectedFiles.length === 0 && existingImagesForEdit.length === 0){ alert('کم از کم 1 تصویر منتخب کریں'); return; } 
  
  addBtn.disabled = true; 
  try {
    status.innerText = 'تصاویر ری سائیز ہو رہی ہیں...'; 
    let compImgs = [];
    for (const f of selectedFiles) {
      compImgs.push(await compressAndResize(f));
    }
    if (compImgs.length === 0) { compImgs = existingImagesForEdit; }

    status.innerText = 'ڈیٹا بیس میں Save ہو رہا ہے...';

    let numericPrice = Number(price);
    let finalPKR = numericPrice;
    if(currency !== 'Rs.') {
      let customRate = Number(document.getElementById('customRateInput').value) || currencyRates[currency] || 280;
      finalPKR = Math.round(numericPrice * customRate);
    }

    let data = { 
      category: category, 
      name: name, 
      brand: document.getElementById('brand').value || 'Sargodha', 
      currency: currency,
      affiliateLink: document.getElementById('affiliateLink').value.trim(),
      mobile: '03334664227',
      desc: document.getElementById('desc').value || '', 
      images: compImgs, 
      price: numericPrice,
      pricePKR: finalPKR,
      sellerName: 'Admin (Ejaz Ahmad)',
      status: 'approved',
      isVerifiedSeller: true,
      createdAt: serverTimestamp() 
    }; 
    
    if(editingId){ 
      await updateDoc(doc(db, 'products', editingId), data); 
      status.innerText = 'آپڈیٹ ہو گیا ✅'; 
    } else { 
      await addDoc(collection(db, 'products'), data); 
      status.innerText = 'کامیابی سے Save ہو گیا ✅'; 
    } 
    resetForm(); 
    loadProducts();
  } catch(e) { 
    status.innerText = 'خرابی: ' + e.message; 
  } finally {
    addBtn.disabled = false; 
  }
};

function resetForm(){ 
  editingId = null; 
  existingImagesForEdit = []; 
  selectedFiles = []; 
  document.getElementById('imageFile').value = ''; 
  document.getElementById('name').value = ''; 
  document.getElementById('priceDirectPKR').value = ''; 
  document.getElementById('brand').value = ''; 
  document.getElementById('affiliateLink').value = '';
  document.getElementById('desc').value = ''; 
  document.getElementById('category').value = '';
  document.getElementById('adCurrency').value = 'Rs.';
  document.getElementById('liveRateNote').innerText = '';
  document.getElementById('manualRateBox').style.display = 'none';
  previewContainer.innerHTML = ''; 
  addBtn.innerText = 'سیو کریں'; 
  cancelEditBtn.style.display = 'none'; 
  status.innerText = 'تصاویر منتخب کریں'; 
}
cancelEditBtn.onclick = resetForm;

async function loadProducts(){ 
  sellerWiseListDiv.innerHTML = 'لوڈ ہو رہا ہے...'; 
  try{ 
    const snap = await getDocs(collection(db, 'products'));
    allProductsCache = [];
    snap.forEach(d => { allProductsCache.push({ id: d.id, ...d.data() }); });

    if(allProductsCache.length === 0){ sellerWiseListDiv.innerHTML = 'کوئی پروڈکٹ نہیں ملی'; return; } 

    let sellersGroup = {};
    allProductsCache.forEach(p => {
      let sMobile = String(p.mobile || '03334664227').trim();
      let sName = (p.sellerName || 'Admin').trim();
      let groupKey = sMobile + "_" + sName;

      if(!sellersGroup[groupKey]) {
        sellersGroup[groupKey] = {
          name: sName,
          mobile: sMobile,
          products: []
        };
      }
      sellersGroup[groupKey].products.push(p);
    });

    sellerWiseListDiv.innerHTML = ''; 

    for(let key in sellersGroup) {
      let group = sellersGroup[key];
      let isAdminGroup = (group.mobile === "03334664227" || group.name.toLowerCase().includes("admin"));

      let headerTitle = isAdminGroup ? `👑 Main Admin (Ejaz Ahmad)` : `👤 Seller: ${group.name} (${group.mobile})`;
      let headerSub = isAdminGroup ? `[Official Admin - No Restrictions]` : `[Registered Seller Account]`;

      let productsHtml = '';
      group.products.forEach(p => {
        let img = (p.images && p.images[0]) || 'logo.png'; 
        let curr = p.currency || 'Rs.';
        let dispPrice = p.price !== undefined ? p.price : (p.pricePKR || 0);
        let dispPKR = p.pricePKR !== undefined ? p.pricePKR : dispPrice;

        let blockButtons = !isAdminGroup ? `
          <div style="margin-top: 4px; display:flex; gap:4px;">
            <button class="btn-block-prod" onclick="blockProduct('${p.id}')" style="background:#e65100; color:white; border:none; padding:3px 6px; border-radius:4px; font-size:10px; cursor:pointer;">Block Product</button>
            <button class="btn-block-seller" onclick="blockSeller('${group.mobile}')" style="background:#d32f2f; color:white; border:none; padding:3px 6px; border-radius:4px; font-size:10px; cursor:pointer;">Block Seller</button>
          </div>
        ` : `<div style="color:#2e7d32; font-size:10px; font-weight:bold; margin-top:2px;">[Your Official Product]</div>`;

        productsHtml += `
          <div class="product-item">
            <img src="${img}">
            <div class="p-info">
              <b>${p.name}</b><br>
              <span>${curr} ${dispPrice} (PKR: ${dispPKR}) | ${p.category}</span><br>
              ${blockButtons}
            </div>
            <div>
              <button class="btn-edit" onclick="editProduct('${p.id}')">ایڈٹ</button>
              <button class="btn-del" onclick="deleteProduct('${p.id}')">ڈیلیٹ</button>
            </div>
          </div>
        `;
      });

      sellerWiseListDiv.innerHTML += `
        <div class="seller-group-card">
          <h3 style="color:#1b5e20; font-size:14px; margin:0 0 4px 0;">${headerTitle}</h3>
          <p style="font-size:11px; color:#555; margin:0 0 8px 0;">${headerSub} | کل پروڈکٹس: <b>${group.products.length}</b></p>
          <hr style="border:0; border-top:1px dashed #2e7d32; margin:6px 0;">
          ${productsHtml}
        </div>
      `;
    }

  }catch(e){ 
    sellerWiseListDiv.innerHTML = 'Error: ' + e.message; 
  } 
}

window.blockProduct = async function(id) {
  if(!confirm("Kya aap is product ko block karna chahte hain?")) return;
  try {
    await updateDoc(doc(db, 'products', id), { isBlocked: true });
    alert("Product block ho gayi hai!");
    loadProducts();
  } catch(err) { alert("Masla hua: " + err.message); }
};

window.blockSeller = async function(mobile) {
  let reason = prompt(`Seller (${mobile}) ko block karne ki wajah likhein:`);
  if(!reason) return;
  try {
    await addDoc(collection(db, "blockedSellers"), { mobile: mobile, reason: reason, blockedAt: new Date() });
    alert("Seller block kar diya gaya hai!");
  } catch(err) { alert("Masla hua: " + err.message); }
};

window.editProduct = function(id) {
  let p = allProductsCache.find(x => x.id === id);
  if(!p) return;
  editingId = p.id; 
  document.getElementById('name').value = p.name || ''; 
  document.getElementById('brand').value = p.brand || ''; 
  document.getElementById('affiliateLink').value = p.affiliateLink || ''; 
  document.getElementById('desc').value = p.desc || ''; 
  document.getElementById('category').value = p.category || ''; 
  document.getElementById('priceDirectPKR').value = p.price !== undefined ? p.price : (p.pricePKR || '');
  document.getElementById('adCurrency').value = p.currency || 'Rs.';
  updateRateInputs();
  convertLiveCurrency();
  
  existingImagesForEdit = p.images || []; 
  previewContainer.innerHTML = ''; 
  if(p.images){
    p.images.forEach(s => {
      let im = document.createElement('img');
      im.src = s;
      previewContainer.appendChild(im);
    });
  } 
  addBtn.innerText = 'اپ ڈیٹ کریں'; 
  cancelEditBtn.style.display = 'block'; 
  window.scrollTo({top:0, behavior:'smooth'});
};

window.deleteProduct = async function(id) {
  if(!confirm('ڈیلیٹ کرنا چاہتے ہیں؟')) return; 
  await deleteDoc(doc(db, 'products', id)); 
  loadProducts();
};

window.loadOrdersFromFirebase = async function() {
  const container = document.getElementById('ordersList');
  container.innerHTML = "لوڈ ہو رہا ہے...";
  try {
    const snap = await getDocs(collection(db, "orders"));
    if(snap.empty) {
      container.innerHTML = "<p style='text-align:center; color:#666;'>Abhi tak koi new order nahi aaya.</p>";
      return;
    }

    container.innerHTML = "";
    let orderIndex = 1;
    snap.forEach((docSnap) => {
      const o = docSnap.data();
      const orderId = docSnap.id;
      
      let curr = o.currency || 'Rs.';
      let rawPrice = o.price !== undefined ? o.price : (o.productPrice !== undefined ? o.productPrice : 5000);
      let totalPrice = Number(String(rawPrice).replace(/[^\d.]/g, '')) || 5000;
      let adminComm = Math.round(totalPrice * 0.05);
      let sellerPay = totalPrice - adminComm;

      let fullPhone = String(o.phone || o.customerMobile || '923334664227').replace(/\D/g, '');
      let maskedPhone = fullPhone.length > 4 ? "******" + fullPhone.slice(-4) : "******" + fullPhone;
      let cleanWaNum = fullPhone.startsWith('92') ? fullPhone : '92' + fullPhone.replace(/^0/, '');

      let statusColor = '#ff9900';
      let statusText = o.escrowStatus || 'Held in Escrow (رقم محفوظ ہے)';
      if(o.payoutStatus === 'Payout Released') {
        statusColor = '#28a745';
        statusText = 'Completed & Released (رقم منتقل کر دی گئی)';
      } else if(o.escrowStatus === 'Held & Cancelled / Damaged') {
        statusColor = '#d9534f';
        statusText = 'Hold / Disputed (پروڈکٹ خراب تھی)';
      }

      let reasonBox = o.holdReason ? `<p style="color:red; font-size:11px; margin-top:2px;"><b>⚠️ وجہ:</b> ${o.holdReason}</p>` : '';

      let matchedProd = allProductsCache.find(p => (p.name || p.title) === o.productName);
      let prodImg = matchedProd && (matchedProd.images?.[0] || matchedProd.img) ? (matchedProd.images?.[0] || matchedProd.img) : 'logo.png';

      container.innerHTML += `
        <div class="order-card">
          <div style="display:flex; align-items:center; gap:8px;">
            <img src="${prodImg}" style="width:45px; height:45px; object-fit:contain; border-radius:4px; border:1px solid #ccc; background:#fff;" onerror="this.src='logo.png'">
            <div style="flex:1;">
              <p style="margin:0 0 2px 0;"><b>📦 آرڈر #${orderIndex++}: ${o.productName || 'Product'}</b></p>
              <p style="margin:0;">👤 کسٹمر: ${o.customerName || 'Unknown'} (📞 <b>${maskedPhone}</b>)</p>
              <div style="margin-top:3px;">
                <a href="tel:${fullPhone}" class="contact-action-btn">📞 Call Karein</a>
                <a href="https://wa.me/${cleanWaNum}?text=Assalam-o-Alaikum%20${encodeURIComponent(o.customerName || 'Customer')},%20R.A.W%20Group%20se%20aap ke%20order%20ke%20سلسلے%20میں%20رابطہ%20ہے۔" target="_blank" class="whatsapp-action-btn">💬 WhatsApp</a>
              </div>
              <p style="margin:4px 0 0 0;">📍 پتہ: ${o.address || o.customerAddress || 'Sargodha'}</p>
            </div>
          </div>
          <hr style="border:0; border-top:1px solid #cbd5e1; margin:6px 0;">
          <p style="margin:2px 0;">💰 Price: <b>${curr} ${totalPrice.toLocaleString()}</b> | <span class="profit-badge">Commission: ${adminComm.toLocaleString()}</span></p>
          <p style="margin:2px 0;">💵 Seller Payout: <b style="color:#194376;">${sellerPay.toLocaleString()}</b></p>
          <p style="margin:2px 0;">🛡️ Escrow Status: <b style="color:${statusColor}">${statusText}</b></p>
          ${reasonBox}
          
          ${o.payoutStatus !== 'Payout Released' ? `
            <div style="display:flex; justify-content:space-between; margin-top:4px;">
              <button class="btn-release" onclick="releaseSellerPayout('${orderId}', '${sellerPay}')">✅ Deliver & Release</button>
              <button class="btn-hold" onclick="holdSellerPayout('${orderId}')">❌ Hold / Damaged</button>
            </div>
          ` : `<span style="color:#28a745; font-weight:bold; display:block; margin-top:4px; text-align:center;">✓ Payout Transferred Successfully</span>`}
        </div>
      `;
    });

  } catch(e) {
    container.innerHTML = "Orders load karne mein masla hua: " + e.message;
  }
};

window.releaseSellerPayout = async function(orderId, payoutAmount) {
  if(!confirm(`Kya order deliver ho gaya hai aur aap seller ko ${payoutAmount} رقم جاری करना चाहते हैं?`)) return;
  try {
    await updateDoc(doc(db, "orders", orderId), {
      escrowStatus: "Completed & Released",
      payoutStatus: "Payout Released"
    });
    alert("Payout Successfully Released to Seller!");
    loadOrdersFromFirebase();
  } catch(e) {
    alert("Update karne mein masla hua.");
  }
};

window.holdSellerPayout = async function(orderId) {
  let reason = prompt("رقم کیوں روکی جا رہی ہے؟ وجہ درج کریں (مثلاً: پروڈکٹ خراب تھی):");
  if(!reason) return;
  try {
    await updateDoc(doc(db, "orders", orderId), {
      escrowStatus: "Held & Cancelled / Damaged",
      payoutStatus: "Payout Held",
      holdReason: reason
    });
    alert("رقم روک دی گئی ہے اور وجہ درج کر دی گئی ہے۔");
    loadOrdersFromFirebase();
  } catch(e) {
    alert("Masla hua, dobara koshish karein.");
  }
};

window.loadProductsFromFirebase = loadProducts;

loadProducts();
loadOrdersFromFirebase();
</script>
</body>
</html>
