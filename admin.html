<!DOCTYPE html><html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<style>body{font-family:Arial;padding:15px;background:#f5f5f5}input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}.btn{width:100%;padding:14px;background:#FF8C00;color:#fff;border:none;border-radius:10px;font-weight:bold;font-size:16px;margin-top:10px}#preview{width:100%;max-height:200px;object-fit:contain;display:none;margin-top:10px;border-radius:10px;border:2px dashed #FF8C00}</style></head><body>
<div style="text-align:center"><img src="logo.png" style="width:80px;border-radius:15px;border:2px solid #FFD700"><h2 style="color:#FF8C00">R.A.W GROUP - Admin Panel</h2></div>
<input id="name" placeholder="پروڈکٹ کا نام"><input id="brand" placeholder="برانڈ"><input id="price" placeholder="قیمت"><input id="desc" placeholder="تفصیل"><input type="file" id="img" accept="image/*">
<img id="preview">
<button class="btn" onclick="save()">پروڈکٹ سیو کریں</button>
<div id="list" style="margin-top:20px"></div>
<script>
let products=JSON.parse(localStorage.getItem('ejaz_products')||'[]');
let finalImage = "";
document.getElementById('img').addEventListener('change',function(e){
 let file=e.target.files[0]; if(!file) return;
 let reader=new FileReader();
 reader.onload=function(ev){
  let im=new Image();
  im.onload=function(){
   let canvas=document.createElement('canvas');
   let maxW=500; let scale=maxW/im.width; if(scale>1) scale=1;
   canvas.width=im.width*scale; canvas.height=im.height*scale;
   canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);
   finalImage=canvas.toDataURL('image/jpeg',0.6);
   document.getElementById('preview').src=finalImage;
   document.getElementById('preview').style.display='block';
  }
  im.src=ev.target.result;
 }
 reader.readAsDataURL(file);
});
function save(){
 if(!finalImage){alert('تصویر منتخب کریں');return;}
 if(!document.getElementById('name').value){alert('نام لکھیں');return;}
 let p={name:document.getElementById('name').value,brand:document.getElementById('brand').value,price:document.getElementById('price').value,desc:document.getElementById('desc').value,image:finalImage};
 products.push(p);
 try{
  localStorage.setItem('ejaz_products',JSON.stringify(products));
  alert('ماشاءاللہ سیو ہو گیا! ✅');
  location.reload();
 }catch(err){ alert('جگہ بھر گئی ہے، ایک پرانا ڈیلیٹ کریں'); }
}
function show(){let l=document.getElementById('list');l.innerHTML='';products.forEach((p,i)=>{l.innerHTML+=`<div style="background:#fff;padding:10px;margin:8px 0;border-radius:10px;display:flex;gap:10px;align-items:center"><img src="${p.image}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><div><b>${i+1}. ${p.name}</b><br><small>${p.brand} - Rs ${p.price}</small></div><button onclick="del(${i})" style="margin-left:auto;background:red;color:#fff;border:none;padding:5px 10px;border-radius:5px">Del</button></div>`;});}
function del(i){products.splice(i,1);localStorage.setItem('ejaz_products',JSON.stringify(products));show();}
show();
</script></body></html>
