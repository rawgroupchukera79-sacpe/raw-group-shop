let base64Image = "";
function compressImage(file, callback){
  const reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = (e) => {
    const img = new Image();
    img.src = e.target.result;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let width = img.width; let height = img.height;
      if(width > 800){ height = height * (800/width); width = 800; }
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL('image/jpeg', 0.6));
    }
  }
}
document.getElementById('imageFile').addEventListener('change', (e)=>{
  const file = e.target.files[0]; if(!file) return;
  document.getElementById('status').innerText = "تصویر تیار ہو رہی ہے...";
  compressImage(file, (compressedData) => {
    base64Image = compressedData;
    const prev = document.getElementById('preview');
    prev.src = base64Image; prev.classList.remove('hidden');
    document.getElementById('status').innerText = "تصویر تیار ہے ✅";
    document.getElementById('status').style.color = "green";
  });
});
