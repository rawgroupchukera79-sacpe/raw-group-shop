<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - IJAZ ALI SHOP</title>
<style>
body{font-family:Arial; background:#f5f5f5; padding:15px; direction:rtl}
.box{background:white; padding:15px; border-radius:10px; margin-bottom:15px}
input,textarea,select{width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:5px}
button{background:#ff6600; color:white; border:none; padding:12px; width:100%; border-radius:5px; font-size:16px}
.item{background:white; padding:10px; margin:10px 0; border-radius:8px; display:flex; gap:10px; align-items:center}
.item img{width:70px; height:70px; object-fit:cover; border-radius:5px}
</style>
</head>
<body>
<h2 style="text-align:center">IJAZ ALI SHOP - Admin</h2>
<div class="box">
<input id="name" placeholder="چیز کا نام لکھیں - مثلاً Bata Shoes">
<input id="price" type="number" placeholder="قیمت لکھیں - مثلاً 3400">
<select id="category"><option>جوتے</option><option>کپڑے</option><option>بیگ</option><option>دیگر</option></select>
<textarea id="detail" placeholder="مکمل تفصیل لکھیں - Pure Leather, Size 9"></textarea>
<input id="image" type="file" accept="image/*">
<button onclick="saveItem()">Save کریں</button>
</div>
<div id="list"></div>
<script>
let items = JSON.parse(localStorage.getItem('ijaz_shop')||'[]');
function saveItem(){
 let n=document.getElementById('name').value.trim();
 let p=document.getElementById('price').value.trim();
 if(!n){alert('نام لکھیں'); return}
 if(!p){alert('قیمت لکھیں'); return}
 let file=document.getElementById('image').files[0];
 if(!file){alert('تصویر منتخب کریں'); return}
 let reader=new FileReader();
 reader.onload=function(e){
  let obj={id:Date.now(), name:n, price:p, cat:document.getElementById('category').value, detail:document.getElementById('detail').value, img:e.target.result};
  items.push(obj);
  localStorage.setItem('ijaz_shop', JSON.stringify(items));
  alert('Save ہو گیا!');
  location.reload();
 };
 reader.readAsDataURL(file);
}
function show(){
 let l=document.getElementById('list');
 l.innerHTML='';
 items.forEach(it=>{
  l.innerHTML+=`<div class="item"><img src="${it.img}"><div style="flex:1"><b>${it.name}</b><br>Rs ${it.price}<br><small>${it.detail}</small></div><div><a href="${it.img}" download="${it.name}.jpg"><button style="background:green; padding:5px; font-size:12px">تصویر ڈاؤن لوڈ</button></a><button onclick="del(${it.id})" style="background:red; padding:5px; font-size:12px; margin-top:5px">ڈیلیٹ</button></div></div>`;
 });
}
function del(id){items=items.filter(x=>x.id!=id); localStorage.setItem('ijaz_shop', JSON.stringify(items)); location.reload();}
show();
</script>
</body>
</html>
