<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE", authDomain: "raw-group-shop.firebaseapp.com", projectId: "raw-group-shop", storageBucket: "raw-group-shop.firebasestorage.app", messagingSenderId: "488689802066", appId: "1:488689802066:web:1437531e15df63e958388b" };
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);

let editingId = null, existingImagesForEdit = [], selectedFiles = [];

async function compressAndResize(f) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const size = 400;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const min = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, size, size);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(f);
  });
}

const status = document.getElementById('status'), listDiv = document.getElementById('productList'), previewContainer = document.getElementById('preview-container'), addBtn = document.getElementById('addBtn'), cancelEditBtn = document.getElementById('cancelEditBtn');

document.getElementById('imageFile').onchange = e => {
  selectedFiles = Array.from(e.target.files).slice(0, 5);
  previewContainer.innerHTML = '';
  selectedFiles.forEach(f => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    previewContainer.appendChild(img);
  });
  status.innerText = selectedFiles.length + ' تصاویر منتخب ہیں ✅';
};

addBtn.onclick = async () => { 
  const name = document.getElementById('name').value.trim(); 
  const category = document.getElementById('category').value;
  const price = document.getElementById('priceDirectPKR').value;
  const currency = document.getElementById('adCurrency').value;

  if(!name){ alert('پروڈکٹ کا نام لکھیں'); return; } 
  if(!category){ alert('کیٹیگری منتخب کریں'); return; }
  if(!price){ alert('قیمت لکھیں'); return; }
  if(!editingId && selectedFiles.length === 0 && existingImagesForEdit.length === 0){ alert('کم از کم 1 تصویر منتخب کریں'); return; } 
  
  addBtn.disabled = true; 
  try {
    status.innerText = 'تصاویر ری سائیز ہو رہی ہیں...'; 
    let compImgs = [];
    for (const f of selectedFiles) {
      compImgs.push(await compressAndResize(f));
    }
    if (compImgs.length === 0) { compImgs = existingImagesForEdit; }

    status.innerText = 'ڈیٹا بیس میں Save ہو رہا ہے...';

    let data = { 
      category: category, 
      name: name, 
      brand: document.getElementById('brand').value || 'Sargodha', 
      currency: currency,
      affiliateLink: document.getElementById('affiliateLink').value.trim(),
      mobile: '03334664227',
      desc: document.getElementById('desc').value || '', 
      images: compImgs, 
      price: Number(price),
      pricePKR: Number(price),
      sellerName: 'Admin (Ejaz Ahmad)',
      status: 'approved',
      isVerifiedSeller: true,
      createdAt: serverTimestamp() 
    }; 
    
    if(editingId){ 
      await updateDoc(doc(db, 'products', editingId), data); 
      status.innerText = 'آپڈیٹ ہو گیا ✅'; 
    } else { 
      await addDoc(collection(db, 'products'), data); 
      status.innerText = 'کامیابی سے Save ہو گیا ✅'; 
    } 
    resetForm(); 
    loadProducts();
  } catch(e) { 
    status.innerText = 'خرابی: ' + e.message; 
  } finally {
    addBtn.disabled = false; 
  }
};

function resetForm(){ 
  editingId = null; 
  existingImagesForEdit = []; 
  selectedFiles = []; 
  document.getElementById('imageFile').value = ''; 
  document.getElementById('name').value = ''; 
  document.getElementById('priceDirectPKR').value = ''; 
  document.getElementById('brand').value = ''; 
  document.getElementById('affiliateLink').value = '';
  document.getElementById('desc').value = ''; 
  document.getElementById('category').value = '';
  document.getElementById('adCurrency').value = 'Rs.';
  previewContainer.innerHTML = ''; 
  addBtn.innerText = 'سیو کریں'; 
  cancelEditBtn.style.display = 'none'; 
  status.innerText = 'تصاویر منتخب کریں'; 
}
cancelEditBtn.onclick = resetForm;

async function loadProducts(){ 
  listDiv.innerHTML = 'لوڈ ہو رہا ہے...'; 
  try{ 
    const snap = await getDocs(collection(db, 'products'));
    if(snap.empty){ listDiv.innerHTML = 'کوئی پروڈکٹ نہیں ملی'; return; } 
    listDiv.innerHTML = ''; 
    snap.forEach(d => { 
      const p = d.data(); 
      let img = (p.images && p.images[0]) || 'logo.png'; 
      let curr = p.currency || 'Rs.';

      let isAdminProduct = (String(p.mobile || '').trim() === "03334664227" || String(p.sellerName || '').includes("Admin"));

      let adminActionButtons = !isAdminProduct ? `
        <div style="margin-top: 5px; display:flex; gap:4px;">
          <button class="btn-block-prod" style="background:#e65100; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">Block</button>
          <button class="btn-block-seller" style="background:#d32f2f; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">Block Seller</button>
        </div>
      ` : `<div style="color:#2e7d32; font-size:10px; font-weight:bold; margin-top:3px;">[Your Official Product]</div>`;

      const div = document.createElement('div'); 
      div.className = 'product-item'; 
      div.innerHTML = `
        <img src="${img}">
        <div class="p-info">
          <b>${p.name}</b><br>
          <span>${curr} ${p.pricePKR || p.price} | ${p.category}</span><br>
          <span style="color:#0a8a00; font-size:11px;">👤 Seller: ${p.sellerName || 'Admin'} (${p.mobile || 'N/A'})</span>
          ${adminActionButtons}
        </div>
        <div>
          <button class="btn-edit">ایڈٹ</button>
          <button class="btn-del">ڈیلیٹ</button>
        </div>
      `; 

      if(!isAdminProduct) {
        div.querySelector('.btn-block-prod').onclick = async () => {
          if(!confirm("Kya aap is product ko block karna chahte hain?")) return;
          try {
            await updateDoc(doc(db, 'products', d.id), { isBlocked: true });
            alert("Product block ho gayi hai!");
            loadProducts();
          } catch(err) { alert("Masla hua: " + err.message); }
        };

        div.querySelector('.btn-block-seller').onclick = async () => {
          let reason = prompt(`Seller (${p.mobile}) ko block karne ki wajah likhein:`);
          if(!reason) return;
          try {
            await addDoc(collection(db, "blockedSellers"), { mobile: p.mobile, reason: reason, blockedAt: new Date() });
            alert("Seller block kar diya gaya hai!");
          } catch(err) { alert("Masla hua: " + err.message); }
        };
      }
      
      div.querySelector('.btn-edit').onclick = () => { 
        editingId = d.id; 
        document.getElementById('name').value = p.name || ''; 
        document.getElementById('brand').value = p.brand || ''; 
        document.getElementById('affiliateLink').value = p.affiliateLink || ''; 
        document.getElementById('desc').value = p.desc || ''; 
        document.getElementById('category').value = p.category || ''; 
        document.getElementById('priceDirectPKR').value = p.pricePKR || p.price || '';
        document.getElementById('adCurrency').value = p.currency || 'Rs.';
        
        existingImagesForEdit = p.images || []; 
        previewContainer.innerHTML = ''; 
        if(p.images){
          p.images.forEach(s => {
            const im = document.createElement('img');
            im.src = s;
            previewContainer.appendChild(im);
          });
        } 
        addBtn.innerText = 'اپ ڈیٹ کریں'; 
        cancelEditBtn.style.display = 'block'; 
        window.scrollTo({top:0, behavior:'smooth'});
      }; 

      div.querySelector('.btn-del').onclick = async () => { 
        if(!confirm('ڈیلیٹ کرنا چاہتے ہیں؟')) return; 
        await deleteDoc(doc(db, 'products', d.id)); 
        div.remove(); 
      }; 

      listDiv.appendChild(div); 
    }); 
  }catch(e){ 
    listDiv.innerHTML = 'Error: ' + e.message; 
  } 
}

window.loadSellersFromFirebase = async function() {
  const container = document.getElementById('sellersList');
  container.innerHTML = "لوڈ ہو رہا ہے...";
  try {
    const snap = await getDocs(collection(db, "products"));
    if(snap.empty) {
      container.innerHTML = "<p style='text-align:center; color:#666;'>Abhi tak koi seller mojood nahi hai.</p>";
      return;
    }
    
    let sellersMap = {};
    snap.forEach((docSnap) => {
      let p = docSnap.data();
      let sName = p.sellerName || 'Unknown Seller';
      let sMobile = p.mobile || '03334664227';
      let key = sMobile + "_" + sName;
      
      if(!sellersMap[key]) {
        sellersMap[key] = { name: sName, mobile: sMobile, adsCount: 0, items: [] };
      }
      sellersMap[key].adsCount++;
      sellersMap[key].items.push(p.name);
    });

    container.innerHTML = "";
    for(let key in sellersMap) {
      let seller = sellersMap[key];
      let cleanMob = seller.mobile.replace(/^0/, '');
      let waLink = `https://wa.me/92${cleanMob}?text=Assalam-o-Alaikum%20${encodeURIComponent(seller.name)},%20R.A.W%20Group%20Admin%20ki%20طرف%20سے%20رابطہ%20ہے۔`;

      container.innerHTML += `
        <div class="seller-card">
          <h4>👤 Seller Name: ${seller.name}</h4>
          <p>📞 WhatsApp / Mobile: <b>${seller.mobile}</b></p>
          <p>📦 Total Active Ads: <b>${seller.adsCount}</b></p>
          <a href="${waLink}" target="_blank" class="whatsapp-contact-btn">💬 Payout / WhatsApp Raabta</a>
        </div>
      `;
    }
  } catch(e) {
    container.innerHTML = "Sellers load karne mein masla hua.";
  }
};

window.loadOrdersFromFirebase = async function() {
  const container = document.getElementById('ordersList');
  container.innerHTML = "لوڈ ہو رہا ہے...";
  try {
    const snap = await getDocs(collection(db, "orders"));
    if(snap.empty) {
      container.innerHTML = "<p style='text-align:center; color:#666;'>Abhi tak koi new order nahi aaya.</p>";
      return;
    }
    container.innerHTML = "";
    snap.forEach((docSnap) => {
      const o = docSnap.data();
      const orderId = docSnap.id;
      let curr = o.currency || 'Rs.';
      let totalPrice = Number(o.productPrice || 0);
      let adminComm = o.adminCommission || Math.round(totalPrice * 0.05);
      let sellerPay = o.sellerPayout || (totalPrice - adminComm);

      let statusColor = '#ff9900';
      let statusText = o.escrowStatus || 'Held in Escrow (رقم محفوظ ہے)';
      if(o.payoutStatus === 'Payout Released') {
        statusColor = '#28a745';
        statusText = 'Completed & Released (رقم منتقل کر دی گئی)';
      } else if(o.escrowStatus === 'Held & Cancelled / Damaged') {
        statusColor = '#d9534f';
        statusText = 'Hold / Disputed (پروڈکٹ خرابی کی وجہ سے رقم روکی گئی)';
      }

      let reasonBox = o.holdReason ? `<p style="color:red; font-size:11px; margin-top:4px;"><b>⚠️ وجہ:</b> ${o.holdReason}</p>` : '';

      container.innerHTML += `
        <div class="order-card">
          <h4>📦 Product: ${o.productName}</h4>
          <p>💰 Total Price: <b>${curr} ${totalPrice}</b> | <span class="profit-badge">5% Commission: ${curr} ${adminComm}</span></p>
          <p>💵 Seller Payout: <b style="color:#194376;">${curr} ${sellerPay}</b></p>
          <p>👤 Customer: ${o.customerName} (${o.customerMobile})</p>
          <p>📍 Address: ${o.customerAddress}</p>
          <p>🛡️ Escrow Status: <b style="color:${statusColor}">${statusText}</b></p>
          ${reasonBox}
          
          ${o.payoutStatus !== 'Payout Released' ? `
            <button class="btn-release" onclick="releaseSellerPayout('${orderId}', '${o.sellerMobile || '03334664227'}', '${sellerPay}')">✅ Deliver & Release Payout (رقم بھیجیں)</button>
            <button class="btn-hold" onclick="holdSellerPayout('${orderId}')">❌ Hold / Product Damaged (رقم روکیں اور وجہ بتائیں)</button>
          ` : `<span style="color:#28a745; font-weight:bold; display:block; margin-top:6px;">✓ Payout Transferred Successfully</span>`}
        </div>
      `;
    });
  } catch(e) {
    container.innerHTML = "Orders load karne mein masla hua: " + e.message;
  }
};

window.releaseSellerPayout = async function(orderId, sellerMobile, payoutAmount) {
  if(!confirm(`Kya order deliver ho gaya hai aur aap seller ko ${payoutAmount} رقم جاری کرنا चाहते ہیں?`)) return;
  try {
    await updateDoc(doc(db, "orders", orderId), {
      escrowStatus: "Completed & Released",
      payoutStatus: "Payout Released"
    });
    alert("Payout Successfully Released to Seller!");
    loadOrdersFromFirebase();
  } catch(e) {
    alert("Update karne mein masla hua.");
  }
};

window.holdSellerPayout = async function(orderId) {
  let reason = prompt("رقم کیوں روکی جا رہی ہے؟ وجہ درج کریں (مثلاً: پروڈکٹ خراب تھی):");
  if(!reason) return;
  try {
    await updateDoc(doc(db, "orders", orderId), {
      escrowStatus: "Held & Cancelled / Damaged",
      payoutStatus: "Payout Held",
      holdReason: reason
    });
    alert("رقم روک دی گئی ہے اور وجہ درج کر دی گئی ہے۔");
    loadOrdersFromFirebase();
  } catch(e) {
    alert("Masla hua, dobara koshish karein.");
  }
};

window.loadProductsFromFirebase = loadProducts;

loadProducts();
loadOrdersFromFirebase();
loadSellersFromFirebase();
</script>
