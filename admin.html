<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.A.W GROUP - Admin</title>
<style>
*{box-sizing:border-box;}
:root{ --orange:#FF8C00; }
body{background:#f2f2f2; font-family:sans-serif; margin:0; padding:10px;}
.box{max-width:520px; margin:15px auto; background:white; border:3px solid var(--orange); border-radius:18px; padding:18px; overflow:hidden;}
.logo-box{width:90px; height:90px; margin:0 auto 10px auto; border:3px solid var(--orange); border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:white;}
.logo-box img{width:100%; height:100%; object-fit:cover;}
h1{color:var(--orange); text-align:center; font-size:22px; margin:5px 0;}
input,select,textarea{width:100%; padding:12px; margin:6px 0; border:2px solid var(--orange); border-radius:10px; font-size:16px; display:block;}
.btn-add{width:100%; padding:14px; background:var(--orange); color:white; border:none; border-radius:10px; font-weight:bold; font-size:18px; cursor:pointer;}
.btn-small{padding:10px; background:#111; color:white; border:none; border-radius:8px; font-weight:bold; width:100%; margin:4px 0; cursor:pointer;}
.btn-logout{background:#ff1a1a; color:white; border:none; padding:8px 12px; border-radius:8px; float:left; cursor:pointer;}
#status{text-align:center; color:green; border:1px dashed var(--orange); padding:7px; border-radius:8px; font-weight:bold; margin:8px 0;}
#preview-container{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; justify-content:center;}
#preview-container img{width:70px; height:70px; object-fit:cover; border-radius:8px; border:2px solid var(--orange);}
.product-item{display:flex; gap:10px; align-items:center; border:2px solid var(--orange); border-radius:12px; padding:8px; margin-bottom:10px; background:#fffaf3; width:100%;}
</style>
</head>
<body>

<div class="box" id="loginBox" style="text-align:center;">
  <div class="logo-box"><img src="logo.png"></div>
  <h1>Admin Login</h1>
  <input type="password" id="adminPass" placeholder="1234" style="text-align:center;">
  <button class="btn-add" id="loginBtn" type="button">لاگ ان کریں</button>
  <p id="loginError" style="color:red; font-weight:bold;"></p>
</div>

<div class="box" id="adminPanel" style="display:none;">
  <button class="btn-logout" id="logoutBtn" type="button">لاگ آؤٹ</button>
  <div class="logo-box"><img src="logo.png"></div>
  <h1>R.A.W GROUP</h1>
  <div id="mainContent"> ... آپ کا باقی سارا پینل یہاں ویسا ہی رہے گا ... </div>
  <div id="productList">لوڈ ہو رہا ہے...</div>
</div>

<!-- LOGIN FIX - YE ALAG HAI -->
<script>
const CORRECT_PASS = "1234";
const loginBox = document.getElementById('loginBox');
const adminPanel = document.getElementById('adminPanel');

function doLogin(){
  let p = document.getElementById('adminPass').value.trim();
  if(p === CORRECT_PASS || p === "1234" || p === "raw123"){
    sessionStorage.setItem('raw_logged_in','true');
    loginBox.style.display='none';
    adminPanel.style.display='block';
  } else {
    document.getElementById('loginError').innerText = 'غلط پاس ورڈ! 1234 لکھیں';
  }
}
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('adminPass').addEventListener('keypress', function(e){ if(e.key==='Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click', function(){
  sessionStorage.removeItem('raw_logged_in');
  adminPanel.style.display='none';
  loginBox.style.display='block';
});

// Pehle se login hai to direct kholo
if(sessionStorage.getItem('raw_logged_in')==='true'){
  loginBox.style.display='none';
  adminPanel.style.display='block';
}
</script>

</body>
</html>
