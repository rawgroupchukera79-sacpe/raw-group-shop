<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE", authDomain: "raw-group-shop.firebaseapp.com", projectId: "raw-group-shop", storageBucket: "raw-group-shop.firebasestorage.app", messagingSenderId: "488689802066", appId: "1:488689802066:web:1437531e15df63e958388b" };
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);

let editingId = null, existingImagesForEdit = [], liveRate = 280, selectedFiles = [];

async function fetchLiveRate(){ 
  try{ 
    let r = await fetch('https://open.er-api.com/v6/latest/USD'); 
    let d = await r.json(); 
    liveRate = d.rates.PKR; 
    document.getElementById('liveRateInfo').innerText = 'Live Rate: Rs. ' + liveRate.toFixed(2); 
    document.getElementById('ratePKR').value = liveRate.toFixed(2); 
    localStorage.setItem('raw_rate', liveRate); 
    updatePKR(); 
  }catch(e){ 
    liveRate = parseFloat(localStorage.getItem('raw_rate') || '280'); 
    document.getElementById('liveRateInfo').innerText = 'Offline Rate: Rs. ' + liveRate; 
  } 
}
document.getElementById('liveRateBtn').onclick = fetchLiveRate; 
fetchLiveRate();

const priceType = document.getElementById('priceType'), pkrContainer = document.getElementById('pkrContainer'), usdContainer = document.getElementById('usdContainer'), liveContainer = document.getElementById('liveContainer');
priceType.onchange = () => { 
  pkrContainer.style.display = 'none'; 
  usdContainer.style.display = 'none'; 
  liveContainer.style.display = 'none'; 
  if(priceType.value === 'pkr') pkrContainer.style.display = 'block'; 
  if(priceType.value === 'usd') usdContainer.style.display = 'block'; 
  if(priceType.value === 'live') liveContainer.style.display = 'block'; 
};

function updatePKR(){ 
  let usd = parseFloat(document.getElementById('priceUSD').value) || 0; 
  let rate = parseFloat(document.getElementById('ratePKR').value) || 0; 
  if(rate === 0 || isNaN(rate)) rate = liveRate || 280; 
  let pkr = Math.round(usd * rate); 
  document.getElementById('pkrPreview').innerText = `Rs. ${pkr.toLocaleString()} (Rate ${rate})`; 
}
document.getElementById('priceUSD').oninput = updatePKR; 
document.getElementById('ratePKR').oninput = updatePKR;

// 📸 آٹو ری سائيز فنکشن (Auto Smart Crop & Center-Resize to 400x400)
function compressAndResize(f) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const targetWidth = 400;  // 400x400 برابر سائز
        const targetHeight = 400;
        canvas.width = targetWidth;
        canvas.height = targetHeight;
        const ctx = canvas.getContext('2d');

        // سینٹر کراپ اور ری سائیز (Center Cropping)
        let minDimension = Math.min(img.width, img.height);
        let srcX = (img.width - minDimension) / 2;
        let srcY = (img.height - minDimension) / 2;

        ctx.drawImage(img, srcX, srcY, minDimension, minDimension, 0, 0, targetWidth, targetHeight);
        
        // 50% JPEG کوالٹی تاکہ سائز بالکل ہلکا رہے
        resolve(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(f);
  });
}

const status = document.getElementById('status'), listDiv = document.getElementById('productList'), previewContainer = document.getElementById('preview-container'), addBtn = document.getElementById('addBtn'), cancelEditBtn = document.getElementById('cancelEditBtn');

document.getElementById('imageFile').onchange = e => { 
  selectedFiles = Array.from(e.target.files).slice(0, 5); // زیادہ سے زیادہ 5 تصاویر
  previewContainer.innerHTML = ''; 
  selectedFiles.forEach(f => { 
    const r = new FileReader(); 
    r.onload = ev => { 
      const img = document.createElement('img'); 
      img.src = ev.target.result; 
      previewContainer.appendChild(img); 
    }; 
    r.readAsDataURL(f); 
  }); 
  status.innerText = selectedFiles.length + ' تصاویر منتخب ہیں ✅'; 
};

addBtn.onclick = async () => { 
  const name = document.getElementById('name').value.trim(); 
  const pType = priceType.value; 
  if(!name){ alert('نام لکھیں'); return; } 
  if(!editingId && selectedFiles.length === 0 && existingImagesForEdit.length === 0){ alert('کم از کم 1 تصویر منتخب کریں'); return; } 
  
  addBtn.disabled = true; 
  status.innerText = 'تصاویر ری سائیز ہو رہی ہیں...'; 
  
  try { 
    let compImgs = existingImagesForEdit; 
    if(selectedFiles.length > 0){ 
      compImgs = []; 
      for(let f of selectedFiles){ 
        let compressed = await compressAndResize(f);
        compImgs.push(compressed); 
      } 
    } 
    
    status.innerText = 'ڈیٹا بیس میں Save ہو رہا ہے...';

    let raw = document.getElementById('affiliateLink').value.trim(); 
    let tag = document.getElementById('companyTag').value.trim() || "rawgroup79-20"; 
    let final = raw; 
    if(raw.includes('amazon')){ 
      final = raw.includes('?') ? (raw.includes('tag=') ? raw : raw + '&tag=' + tag) : raw + '?tag=' + tag; 
    } 
    
    let data = { 
      category: document.getElementById('category').value, 
      name, 
      brand: document.getElementById('brand').value || '', 
      affiliateLink: final, 
      desc: document.getElementById('desc').value || '', 
      images: compImgs, 
      createdAt: serverTimestamp() 
    }; 
    
    if(pType === 'usd'){ 
      let usd = Number(document.getElementById('priceUSD').value) || 0; 
      let rate = Number(document.getElementById('ratePKR').value) || liveRate || 280; 
      if(rate === 0) rate = liveRate || 280; 
      data.priceUSD = usd; 
      data.pricePKR = Math.round(usd * rate); 
      data.priceType = 'usd'; 
      data.price = usd; 
      data.rateUsed = rate; 
    } else if(pType === 'pkr'){ 
      data.pricePKR = Number(document.getElementById('priceDirectPKR').value) || 0; 
      data.priceType = 'pkr'; 
      data.price = data.pricePKR; 
    } else { 
      data.priceType = 'live'; 
      data.price = 0; 
      data.pricePKR = 0; 
      data.priceUSD = 0; 
      data.isZeroPrice = true; 
    } 
    
    if(editingId){ 
      await updateDoc(doc(db, 'products', editingId), data); 
      status.innerText = 'آپڈیٹ ہو گیا ✅'; 
    } else { 
      await addDoc(collection(db, 'products'), data); 
      status.innerText = 'کامیابی سے Save ہو گیا ✅'; 
    } 
    
    resetForm(); 
    loadProducts(); 
  } catch(e) { 
    console.error(e);
    status.innerText = 'خرابی: ' + e.message; 
    alert('Save نہیں ہو سکا: ' + e.message);
  } finally {
    addBtn.disabled = false; 
  }
};

function resetForm(){ 
  editingId = null; 
  existingImagesForEdit = []; 
  selectedFiles = []; 
  document.getElementById('imageFile').value = ''; 
  document.getElementById('name').value = ''; 
  document.getElementById('priceDirectPKR').value = ''; 
  document.getElementById('priceUSD').value = ''; 
  document.getElementById('brand').value = ''; 
  document.getElementById('desc').value = ''; 
  previewContainer.innerHTML = ''; 
  addBtn.innerText = 'سیو کریں'; 
  cancelEditBtn.style.display = 'none'; 
  status.innerText = 'تصاویر منتخب کریں'; 
}
cancelEditBtn.onclick = resetForm;

async function loadProducts(){ 
  listDiv.innerHTML = 'لوڈ ہو رہا ہے...'; 
  try{ 
    const snap = await getDocs(collection(db, 'products'));
    if(snap.empty){ listDiv.innerHTML = 'کوئی پروڈکٹ نہیں'; return; } 
    listDiv.innerHTML = ''; 
    snap.forEach(d => { 
      const p = d.data(); 
      let img = (p.images && p.images[0]) || 'logo.png'; 
      let price = p.priceType === 'usd' ? `$${p.priceUSD} (Rs.${p.pricePKR})` : p.priceType === 'live' ? '00 On-Day' : `Rs.${p.pricePKR || p.price}`; 
      const div = document.createElement('div'); 
      div.className = 'product-item'; 
      div.innerHTML = `<img src="${img}"><div class="p-info"><b>${p.name}</b><span>${price}</span></div><div><button class="btn-edit">ایڈٹ</button><button class="btn-del">ڈیلیٹ</button></div>`; 
      
      div.querySelector('.btn-edit').onclick = () => { 
        editingId = d.id; 
        document.getElementById('name').value = p.name || ''; 
        document.getElementById('brand').value = p.brand || ''; 
        document.getElementById('affiliateLink').value = p.affiliateLink || ''; 
        document.getElementById('desc').value = p.desc || ''; 
        document.getElementById('category').value = p.category || 'Shoes'; 
        
        if(p.priceType === 'usd'){
          priceType.value = 'usd';
          pkrContainer.style.display = 'none';
          usdContainer.style.display = 'block';
          liveContainer.style.display = 'none';
          document.getElementById('priceUSD').value = p.priceUSD || '';
          document.getElementById('ratePKR').value = p.rateUsed || liveRate;
          updatePKR();
        } else if(p.priceType === 'live'){
          priceType.value = 'live';
          pkrContainer.style.display = 'none';
          usdContainer.style.display = 'none';
          liveContainer.style.display = 'block';
        } else {
          priceType.value = 'pkr';
          pkrContainer.style.display = 'block';
          usdContainer.style.display = 'none';
          liveContainer.style.display = 'none';
          document.getElementById('priceDirectPKR').value = p.pricePKR || p.price || '';
        } 
        
        existingImagesForEdit = p.images || []; 
        previewContainer.innerHTML = ''; 
        if(p.images){
          p.images.forEach(s => {
            const im = document.createElement('im');
            im.src = s;
            previewContainer.appendChild(im);
          });
        } 
        addBtn.innerText = 'اپ ڈیٹ کریں'; 
        cancelEditBtn.style.display = 'block'; 
        window.scrollTo({top:0, behavior:'smooth'});
      }; 

      div.querySelector('.btn-del').onclick = async () => { 
        if(!confirm('ڈیلیٹ کریں؟')) return; 
        await deleteDoc(doc(db, 'products', d.id)); 
        div.remove(); 
      }; 

      listDiv.appendChild(div); 
    }); 
  }catch(e){ 
    listDiv.innerHTML = 'Error: ' + e.message; 
  } 
}
loadProducts();
</script>
