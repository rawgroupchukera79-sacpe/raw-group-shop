<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Product Upload</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .admin-container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], textarea, input[type="file"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #218838; }
        #loading { text-align: center; color: #007bff; display: none; margin-top: 10px; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>Add New Product</h2>
    <form id="productForm">
        <div class="form-group">
            <label for="productName">Product Name:</label>
            <input type="text" id="productName" required>
        </div>
        <div class="form-group">
            <label for="productPrice">Price:</label>
            <input type="text" id="productPrice" required>
        </div>
        <div class="form-group">
            <label for="productDesc">Description:</label>
            <textarea id="productDesc" rows="4" required></textarea>
        </div>
        <div class="form-group">
            <label for="productImages">Upload Images (Multiple):</label>
            <input type="file" id="productImages" accept="image/*" multiple required>
        </div>
        <button type="submit" id="submitBtn">Publish Product</button>
        <div id="loading">Uploading product, please wait...</div>
    </form>
</div>

<!-- Firebase SDKs -->

        } catch (error) {

</script>

</body>
</html>
