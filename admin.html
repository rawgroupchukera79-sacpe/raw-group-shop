<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IJAZ ALI - Admin Final</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<script>
let saved = localStorage.getItem("admin_pass_raw");
if(saved!== "ijaz79"){
  let p = prompt("ایڈمن پاس ورڈ لکھیں:");
  if(p!== "ijaz79"){
    document.write("<h1 style='text-align:center;margin-top:100px;color:red'>غلط پاس ورڈ</h1>");
    throw new Error("Stop");
  }else{ localStorage.setItem("admin_pass_raw", "ijaz79"); }
}
</script>
</head>
<body class="bg-gray-100">
<div class="p-3 shadow" style="background:#FF8C00">
  <div class="flex items-center justify-between max-w-lg mx-auto" dir="ltr">
    <div class="flex items-center gap-2">
      <img src="logo.png" class="w-11 h-11 bg-white rounded-full p-1 border-2 border-white">
      <div class="text-white leading-none text-left"><h1 class="font-extrabold text-lg">IJAZ ALI</h1><p class="text-xs mt-1">R.A.W GROUP CHAKERA</p></div>
    </div>
    <img src="ejaz.jpg" class="w-11 h-11 rounded-full border-2 border-white object-cover">
  </div>
</div>

<div class="max-w-lg mx-auto p-4">
  <div class="bg-white rounded-2xl p-5 shadow-md mt-4 border-t-4" style="border-color:#FF8C00">
    <h2 class="text-center font-bold text-2xl mb-5">نیا پروڈکٹ ڈالیں</h2>
    <input id="name" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center outline-none" placeholder="نام">
    <input id="price" type="number" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center outline-none" placeholder="قیمت">
    <input id="brand" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center outline-none" placeholder="تھان / برانڈ">
    <textarea id="desc" rows="3" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center outline-none" placeholder="تصویر کی تفصیل"></textarea>

    <!-- اب یہ والا Choose File 100% کام کرے گا -->
    <input type="file" id="imageFile" accept="image/*" class="w-full bg-gray-100 border-2 border-dashed border-gray-300 rounded-xl p-3 mb-3">

    <img id="preview" class="w-full h-56 object-cover rounded-xl hidden mb-3 border">
    <p id="compressInfo" class="text-center text-xs text-gray-500 mb-2"></p>

    <button id="addBtn" class="w-full text-white font-bold p-3.5 rounded-xl text-lg shadow" style="background:#FF8C00">Add Product - دکان پر لگائیں</button>
    <p id="status" class="text-center mt-3 font-bold"></p>
    <a href="shop.html" class="block text-center mt-4 font-bold" style="color:#FF8C00">← دکان دیکھیں</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE",
  authDomain: "raw-group-shop.firebaseapp.com",
  projectId: "raw-group-shop",
  storageBucket: "raw-group-shop.firebasestorage.app",
  messagingSenderId: "488689802066",
  appId: "1:488689802066:web:1437531e15df63e958388b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let finalFileToUpload = null;

// تصویر خود بخود چھوٹی کرنے والا فنکشن
function compressImage(file, callback) {
  const reader = new FileReader();
  reader.readAsDataURL(file);
  reader.onload = (e) => {
    const img = new Image();
    img.src = e.target.result;
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      // 800px سے بڑی ہو تو چھوٹی کر دو
      if (w > 800) { h = h * (800 / w); w = 800; }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      // 60% کوالٹی پر چھوٹی فائل بناؤ
      canvas.toBlob((blob) => {
        callback(blob);
      }, 'image/jpeg', 0.6);
    };
  };
}

document.getElementById('imageFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('status').innerText = "تصویر خود بخود چھوٹی کی جا رہی ہے...";
  document.getElementById('status').style.color = "black";

  compressImage(file, (compressedBlob) => {
    finalFileToUpload = compressedBlob;
    const pr = document.getElementById('preview');
    pr.src = URL.createObjectURL(compressedBlob);
    pr.classList.remove('hidden');
    document.getElementById('compressInfo').innerText = `پہلے: ${(file.size/1024/1024).toFixed(2)} MB -> اب: ${(compressedBlob.size/1024).toFixed(0)} KB`;
    document.getElementById('status').innerText = "تصویر تیار ہے ✅ اب Add دبائیں";
    document.getElementById('status').style.color = "green";
  });
});

document.getElementById('addBtn').addEventListener('click', async () => {
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  if (!name ||!price ||!finalFileToUpload) { alert("نام، قیمت اور تصویر ضروری ہے"); return; }

  const s = document.getElementById('status');
  s.style.color = "black";
  s.innerText = "اپلوڈ ہو رہا ہے...";

  try {
    const storageRef = ref(storage, 'products/' + Date.now() + '.jpg');
    await uploadBytes(storageRef, finalFileToUpload);
    const imageUrl = await getDownloadURL(storageRef);

    await addDoc(collection(db, "products"), {
      name, price,
      brand: document.getElementById('brand').value,
      desc: document.getElementById('desc').value,
      image: imageUrl,
      createdAt: serverTimestamp()
    });
    s.style.color = "green";
    s.innerText = "ماشاءاللہ! دکان پر لگ گیا ✅";
    setTimeout(() => { location.href = "shop.html" }, 1000);
  } catch (err) {
    s.style.color = "red";
    s.innerText = "ایرر: " + err.message;
  }
});
</script>
</body>
</html>
