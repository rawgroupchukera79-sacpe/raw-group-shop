<head>

<style>
*{box-sizing:border-box;}
:root{ --orange:#FF8C00; }
body{background:#f5f5f5; font-family:sans-serif; margin:0; padding:10px;}
.box{max-width:520px; margin:15px auto; background:white; border:3px solid var(--orange); border-radius:18px; padding:18px; overflow:hidden; position:relative;}
.logo-box{width:90px; height:90px; margin:0 auto 10px auto; border:3px solid var(--orange); border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:white;}
.logo-box img{width:100%; height:100%; object-fit:cover;}
h1{color:var(--orange); text-align:center; font-size:22px; margin:5px 0;}
input,select,textarea{width:100%; padding:12px; margin:6px 0; border:2px solid var(--orange); border-radius:10px; font-size:16px; display:block;}
.btn-add{width:100%; padding:14px; background:var(--orange); color:white; border:none; border-radius:10px; font-weight:bold; font-size:18px; cursor:pointer;}
.btn-logout{position:absolute; top:12px; left:12px; background:#ff1a1a; color:white; border:none; padding:7px 14px; border-radius:8px; cursor:pointer; font-weight:bold;}
#status{text-align:center; color:green; border:1px dashed var(--orange); padding:7px; border-radius:8px; font-weight:bold; margin:8px 0;}
#preview-container{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; justify-content:center;}
#preview-container img{width:70px; height:70px; object-fit:cover; border-radius:8px; border:2px solid var(--orange);}
.product-item{display:flex; gap:10px; align-items:center; border:2px solid var(--orange); border-radius:12px; padding:8px; margin-bottom:10px; background:#fffaf3; width:100%;}
.product-item img{width:60px; height:60px; object-fit:cover; border-radius:8px; flex-shrink:0;}
.p-info{flex:1; text-align:right; font-size:13px; overflow:hidden;}
.btn-edit{background:var(--orange); color:white; border:none; padding:6px 10px; border-radius:6px; margin:2px; cursor:pointer;}
.btn-del{background:#ff1a1a; color:white; border:none; padding:6px 10px; border-radius:6px; margin:2px; cursor:pointer;}
#pkrPreview{text-align:center; background:#fff6e6; padding:6px; border-radius:8px; font-weight:bold; font-size:14px;}
</style>
</head>
<body>

<div class="box" id="loginBox" style="text-align:center;">

<div class="box" id="adminPanel" style="display:none;">
  <button class="btn-logout" id="logoutBtn" type="button">لاگ آؤٹ</button>
  <div class="logo-box"><img src="logo.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'"></div>
  <h1>R.A.W GROUP</h1>

  <button class="btn-add" id="liveRateBtn" type="button" style="background:#0a8a00; padding:10px;">🔴 Live Dollar Rate لائیں</button>
  <div id="liveRateInfo" style="text-align:center; font-size:12px; color:green; font-weight:bold; margin:5px 0;"></div>

 <script>

  {n:'⌚ گھڑیاں', v:'Watches', s:[{n:'Men Watches', v:'Men Watches'}, {n:'Women Watches', v:'Women Watches'}]},
  {n:'🧴 پرفیوم', v:'Perfume'},

  {n:'⚡ الیکٹرانکس', v:'Electronics', s:[{n:'Chargers', v:'Chargers'}, {n:'Headphones', v:'Headphones'}]},

<input id="name" placeholder="پروڈکٹ کا نام *">
<input id="name" placeholder="پروڈکٹ کا نام *">
  <input id="brand" placeholder="برانڈ">
  <select id="priceType">
    <option value="pkr">🇵🇰 PKR قیمت</option>
    <option value="usd">💲 USD + PKR</option>
    <option value="live">🔴 00 On-Day Price</option>
  </select>
  <div id="pkrContainer"><input id="priceDirectPKR" type="number" placeholder="PKR قیمت لکھیں"></div>
  <div id="usdContainer" style="display:none;"><div style="display:flex; gap:8px;"><input id="priceUSD" type="number" step="0.01" placeholder="$ قیمت" style="flex:1;"><input id="ratePKR" type="number" value="280" style="flex:1;"></div><div id="pkrPreview">Rs. 0</div></div>
  <div id="liveContainer" style="display:none; background:#ffe9cc; padding:10px; text-align:center; border-radius:8px; font-weight:bold; margin:6px 0;">00 Mode: دکان پر On-Day Live Price</div>

  <input id="affiliateLink" placeholder="Amazon / Daraz / Alibaba لنک">
  <input id="companyTag" placeholder="Tag (rawgroup79-20)" value="rawgroup79-20">
  <textarea id="desc" rows="2" placeholder="تفصیل لکھیں"></textarea>

  <div id="preview-container"></div>
  <div id="status">تصاویر منتخب کریں</div>
  <button class="btn-add" id="addBtn" type="button">سیو کریں</button>
  <button id="cancelEditBtn" type="button" style="display:none; background:#666; color:white; width:100%; padding:10px; border-radius:10px; margin-top:5px; border:none;">کینسل کریں</button>
  <a href="index.html" style="display:block; text-align:center; background:#111; color:white; padding:12px; border-radius:10px; text-decoration:none; margin-top:12px; font-weight:bold;">🛍️ Shop Dekhen - دکان دیکھیں</a>
  <hr style="margin:15px 0; border:1px dashed #FF8C00;">
  <div id="productList">لوڈ ہو رہا ہے...</div>
</div>

<script>
const CORRECT_PASS="1234";
const loginBox=document.getElementById('loginBox'), adminPanel=document.getElementById('adminPanel');
function doLogin(){ let p=document.getElementById('adminPass').value.trim(); if(p===CORRECT_PASS){sessionStorage.setItem('raw_logged_in','true'); loginBox.style.display='none'; adminPanel.style.display='block';} else{document.getElementById('loginError').innerText='غلط پاس ورڈ! 1234 لکھیں';} }
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('adminPass').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('logoutBtn').addEventListener('click',()=>{sessionStorage.removeItem('raw_logged_in'); adminPanel.style.display='none'; loginBox.style.display='block';});
if(sessionStorage.getItem('raw_logged_in')==='true'){loginBox.style.display='none'; adminPanel.style.display='block';}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE", authDomain: "raw-group-shop.firebaseapp.com", projectId: "raw-group-shop", storageBucket: "raw-group-shop.firebasestorage.app", messagingSenderId: "488689802066", appId: "1:488689802066:web:1437531e15df63e958388b" };
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);

let editingId = null, existingImagesForEdit = [], liveRate = 280, selectedFiles = [];

async function fetchLiveRate(){ 
  try{ 
    let r = await fetch('https://open.er-api.com/v6/latest/USD'); 
    let d = await r.json(); 
    liveRate = d.rates.PKR; 
    document.getElementById('liveRateInfo').innerText = 'Live Rate: Rs. ' + liveRate.toFixed(2); 
    document.getElementById('ratePKR').value = liveRate.toFixed(2); 
    localStorage.setItem('raw_rate', liveRate); 
    updatePKR(); 
  }catch(e){ 
    liveRate = parseFloat(localStorage.getItem('raw_rate') || '280'); 
    document.getElementById('liveRateInfo').innerText = 'Offline Rate: Rs. ' + liveRate; 
  } 
}
document.getElementById('liveRateBtn').onclick = fetchLiveRate; 
fetchLiveRate();

const priceType = document.getElementById('priceType'), pkrContainer = document.getElementById('pkrContainer'), usdContainer = document.getElementById('usdContainer'), liveContainer = document.getElementById('liveContainer');
priceType.onchange = () => { 
  pkrContainer.style.display = 'none'; 
  usdContainer.style.display = 'none'; 
  liveContainer.style.display = 'none'; 
  if(priceType.value === 'pkr') pkrContainer.style.display = 'block'; 
  if(priceType.value === 'usd') usdContainer.style.display = 'block'; 
  if(priceType.value === 'live') liveContainer.style.display = 'block'; 
};

function updatePKR(){ 
  let usd = parseFloat(document.getElementById('priceUSD').value) || 0; 
  let rate = parseFloat(document.getElementById('ratePKR').value) || 0; 
  if(rate === 0 || isNaN(rate)) rate = liveRate || 280; 
  let pkr = Math.round(usd * rate); 
  document.getElementById('pkrPreview').innerText = `Rs. ${pkr.toLocaleString()} (Rate ${rate})`; 
}
document.getElementById('priceUSD').oninput = updatePKR; 
document.getElementById('ratePKR').oninput = updatePKR;

async function compressAndResize(f) {
  const size = 400;
  let source, w, h, cleanup = () => {};

  try {
    if (window.createImageBitmap) {
      const bmp = await createImageBitmap(f);
      source = bmp; w = bmp.width; h = bmp.height;
      cleanup = () => bmp.close && bmp.close();
    } else {
      throw new Error('fallback');
    }
  } catch (_) {
    const url = URL.createObjectURL(f);
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error('تصویر نہیں کھل سکی: ' + (f.name || '') + ' (' + (f.type || 'نامعلوم فارمیٹ') + ')'));
      img.src = url;
    });
    source = img; w = img.naturalWidth; h = img.naturalHeight;
    cleanup = () => URL.revokeObjectURL(url);
  }

  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const min = Math.min(w, h);
  ctx.drawImage(source, (w - min) / 2, (h - min) / 2, min, min, 0, 0, size, size);
  cleanup();
  return canvas.toDataURL('image/jpeg', 0.5);
}

const status = document.getElementById('status'), listDiv = document.getElementById('productList'), previewContainer = document.getElementById('preview-container'), addBtn = document.getElementById('addBtn'), cancelEditBtn = document.getElementById('cancelEditBtn');

document.getElementById('imageFile').onchange = e => {
  selectedFiles = Array.from(e.target.files).slice(0, 5);
  previewContainer.innerHTML = '';
  selectedFiles.forEach(f => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.onload = () => URL.revokeObjectURL(img.src);
    previewContainer.appendChild(img);
  });
  status.innerText = selectedFiles.length + ' تصاویر منتخب ہیں ✅';
};

addBtn.onclick = async () => { 
  const name = document.getElementById('name').value.trim(); 
  const pType = priceType.value; 
  if(!name){ alert('نام لکھیں'); return; } 
  if(!editingId && selectedFiles.length === 0 && existingImagesForEdit.length === 0){ alert('کم از کم 1 تصویر منتخب کریں'); return; } 
  
  addBtn.disabled = true; 

  try {
    status.innerText = 'تصاویر ری سائیز ہو رہی ہیں...'; 

    let compImgs = [];
    for (const f of selectedFiles) {
      compImgs.push(await compressAndResize(f));
    }
    if (compImgs.length === 0) {
      compImgs = existingImagesForEdit;
    }
    if (compImgs.length === 0) {
      alert('Karam karke kam se kam ek tasveer zaroor select karein!');
      status.innerText = 'Tasveerein select karein';
      return;
    }

    status.innerText = 'ڈیٹا بیس میں Save ہو رہا ہے...';

    let raw = document.getElementById('affiliateLink').value.trim(); 
    let tag = document.getElementById('companyTag').value.trim() || "rawgroup79-20"; 
    let final = raw; 
    if(raw.includes('amazon')){ 
      final = raw.includes('?') ? (raw.includes('tag=') ? raw : raw + '&tag=' + tag) : raw + '?tag=' + tag; 
    } 
    
    let data = { 
      category: document.getElementById('category').value, 
      name, 
      brand: document.getElementById('brand').value || '', 
      affiliateLink: final, 
      desc: document.getElementById('desc').value || '', 
      images: compImgs, 
      createdAt: serverTimestamp() 
    }; 
    
    if(pType === 'usd'){ 
      let usd = Number(document.getElementById('priceUSD').value) || 0; 
      let rate = Number(document.getElementById('ratePKR').value) || liveRate || 280; 
      if(rate === 0) rate = liveRate || 280; 
      data.priceUSD = usd; 
      data.pricePKR = Math.round(usd * rate); 
      data.priceType = 'usd'; 
      data.price = usd; 
      data.rateUsed = rate; 
    } else if(pType === 'pkr'){ 
      data.pricePKR = Number(document.getElementById('priceDirectPKR').value) || 0; 
      data.priceType = 'pkr'; 
      data.price = data.pricePKR; 
    } else { 
      data.priceType = 'live'; 
      data.price = 0; 
      data.pricePKR = 0; 
      data.priceUSD = 0; 
      data.isZeroPrice = true; 
    } 
    
    if(editingId){ 
      await updateDoc(doc(db, 'products', editingId), data); 
      status.innerText = 'آپڈیٹ ہو گیا ✅'; 
    } else { 
      await addDoc(collection(db, 'products'), data); 
      status.innerText = 'کامیابی سے Save ہو گیا ✅'; 
    } 
    
    resetForm(); 
    loadProducts();
    
  } catch(e) { 
    console.error(e);
    let errMsg = (e && e.message) ? e.message : String(e);
    status.innerText = 'خرابی: ' + errMsg; 
    alert('Save نہیں ہو سکا: ' + errMsg);
  } finally {
    addBtn.disabled = false; 
  }
};

function resetForm(){ 
  editingId = null; 
  existingImagesForEdit = []; 
  selectedFiles = []; 
  document.getElementById('imageFile').value = ''; 
  document.getElementById('name').value = ''; 
  document.getElementById('priceDirectPKR').value = ''; 
  document.getElementById('priceUSD').value = ''; 
  document.getElementById('brand').value = ''; 
  document.getElementById('desc').value = ''; 
  previewContainer.innerHTML = ''; 
  addBtn.innerText = 'سیو کریں'; 
  cancelEditBtn.style.display = 'none'; 
  status.innerText = 'تصاویر منتخب کریں'; 
}
cancelEditBtn.onclick = resetForm;

async function loadProducts(){ 
  listDiv.innerHTML = 'لوڈ ہو رہا ہے...'; 
  try{ 
    const snap = await getDocs(collection(db, 'products'));
    if(snap.empty){ listDiv.innerHTML = 'کوئی پروڈکٹ نہیں'; return; } 
    listDiv.innerHTML = ''; 
    snap.forEach(d => { 
      const p = d.data(); 
      let img = (p.images && p.images[0]) || 'logo.png'; 
      let price = p.priceType === 'usd' ? `$${p.priceUSD} (Rs.${p.pricePKR})` : p.priceType === 'live' ? '00 On-Day' : `Rs.${p.pricePKR || p.price}`; 
      const div = document.createElement('div'); 
      div.className = 'product-item'; 
      div.innerHTML = `<img src="${img}"><div class="p-info"><b>${p.name}</b><span>${price}</span></div><div><button class="btn-edit">ایڈٹ</button><button class="btn-del">ڈیلیٹ</button></div>`; 
      
      div.querySelector('.btn-edit').onclick = () => { 
        editingId = d.id; 
        document.getElementById('name').value = p.name || ''; 
        document.getElementById('brand').value = p.brand || ''; 
        document.getElementById('affiliateLink').value = p.affiliateLink || ''; 
        document.getElementById('desc').value = p.desc || ''; 
        document.getElementById('category').value = p.category || 'Shoes'; 
        
        if(p.priceType === 'usd'){
          priceType.value = 'usd';
          pkrContainer.style.display = 'none';
          usdContainer.style.display = 'block';
          liveContainer.style.display = 'none';
          document.getElementById('priceUSD').value = p.priceUSD || '';
          document.getElementById('ratePKR').value = p.rateUsed || liveRate;
          updatePKR();
        } else if(p.priceType === 'live'){
          priceType.value = 'live';
          pkrContainer.style.display = 'none';
          usdContainer.style.display = 'none';
          liveContainer.style.display = 'block';
        } else {
          priceType.value = 'pkr';
          pkrContainer.style.display = 'block';
          usdContainer.style.display = 'none';
          liveContainer.style.display = 'none';
          document.getElementById('priceDirectPKR').value = p.pricePKR || p.price || '';
        } 
        
        existingImagesForEdit = p.images || []; 
        previewContainer.innerHTML = ''; 
        if(p.images){
          p.images.forEach(s => {
            const im = document.createElement('img');
            im.src = s;
            previewContainer.appendChild(im);
          });
        } 
        addBtn.innerText = 'اپ ڈیٹ کریں'; 
        cancelEditBtn.style.display = 'block'; 
        window.scrollTo({top:0, behavior:'smooth'});
      }; 

      div.querySelector('.btn-del').onclick = async () => { 
        if(!confirm('ڈیلیٹ کریں؟')) return; 
        await deleteDoc(doc(db, 'products', d.id)); 
        div.remove(); 
      }; 

      listDiv.appendChild(div); 
    }); 
  }catch(e){ 
    listDiv.innerHTML = 'Error: ' + e.message; 
  } 
}
loadProducts();
</script>
