<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IJAZ ALI - Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
// --- پاس ورڈ پروٹیکشن ---
let savedPass = localStorage.getItem("admin_pass_raw");
if(savedPass!== "ijaz79"){
  let p = prompt("ایڈمن پاس ورڈ لکھیں:");
  if(p!== "ijaz79"){
    document.body.innerHTML = "<h1 style='text-align:center;margin-top:100px;color:red;font-family:Arial'>غلط پاس ورڈ - اجازت نہیں ہے</h1>";
    throw new Error("Wrong password");
  }else{
    localStorage.setItem("admin_pass_raw", "ijaz79");
  }
}
</script>
<style>body{direction:rtl}</style>
</head>
<body class="bg-gray-100">

<!-- اوپر نارنجی ہیڈر آپ کے لوگو اور تصویر کے ساتھ -->
<div class="bg-[#FF8C00] p-3 shadow-lg">
  <div class="flex items-center justify-between max-w-lg mx-auto">
    <div class="flex items-center gap-2">
      <img src="logo.png" class="w-11 h-11 bg-white rounded-full p-1 border-2 border-white" onerror="this.src='https://via.placeholder.com/44'">
      <div class="text-white leading-none">
        <h1 class="font-extrabold text-[18px]">IJAZ ALI</h1>
        <p class="text-[11px] mt-1">R.A.W GROUP CHAKERA</p>
      </div>
    </div>
    <img src="ejaz.jpg" class="w-11 h-11 rounded-full border-2 border-white object-cover" onerror="this.src='logo.png'">
  </div>
</div>

<div class="max-w-lg mx-auto p-4">
  <div class="bg-white rounded-[18px] p-5 shadow-md mt-3 border-t-4 border-[#FF8C00]">
    <h2 class="text-center font-bold text-[22px] mb-5">نیا پروڈکٹ ڈالیں</h2>

    <input id="name" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center focus:border-[#FF8C00] outline-none" placeholder="نام - مثلاً Peshawari Chappal">
    <input id="price" type="number" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center focus:border-[#FF8C00] outline-none" placeholder="قیمت - مثلاً 4500">
    <input id="brand" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center focus:border-[#FF8C00] outline-none" placeholder="تھان / برانڈ / کوالٹی">
    <textarea id="desc" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center focus:border-[#FF8C00] outline-none" placeholder="تفصیل (اگر کوئی ہو)"></textarea>

    <!-- تصویر اپلوڈ - کوئی بھی تصویر -->
    <label class="w-full bg-gray-200 rounded-xl p-3 mb-3 flex justify-center items-center gap-2 cursor-pointer font-bold">
      <span>📸 کوئی بھی تصویر منتخب کریں (گیلری سے)</span>
      <input type="file" id="imageFile" accept="image/*" hidden>
    </label>

    <img id="preview" class="w-full h-56 object-cover rounded-xl hidden mb-3 border">

    <button id="addBtn" class="w-full bg-[#FF8C00] text-white font-bold p-3.5 rounded-xl text-[17px] shadow">Add Product - دکان پر لگائیں</button>
    <p id="status" class="text-center mt-3 font-bold text-green-600"></p>
    <a href="shop.html" class="block text-center mt-4 text-[#FF8C00] font-bold">← دکان دیکھیں</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE",
  authDomain: "raw-group-shop.firebaseapp.com",
  projectId: "raw-group-shop",
  storageBucket: "raw-group-shop.firebasestorage.app",
  messagingSenderId: "488689802066",
  appId: "1:488689802066:web:1437531e15df63e958388b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let base64Image = "";
document.getElementById('imageFile').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    base64Image = reader.result;
    const prev = document.getElementById('preview');
    prev.src = base64Image;
    prev.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
});
document.getElementById('addBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  if(!name ||!price ||!base64Image){ alert("نام، قیمت اور تصویر ضروری ہے"); return; }
  document.getElementById('status').innerText = "اپلوڈ ہو رہا ہے...";
  await addDoc(collection(db, "products"), {
    name: name,
    price: price,
    brand: document.getElementById('brand').value,
    desc: document.getElementById('desc').value,
    image: base64Image,
    createdAt: serverTimestamp()
  });
  document.getElementById('status').innerText = "ماشاءاللہ! دکان پر لگ گیا ✅";
  setTimeout(()=>{ location.reload(); }, 1500);
});
</script>
</body>
</html>
