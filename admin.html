<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  // اپنا والا Config یہاں رہنے دیں
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let finalFileToUpload = null;

// 1. یہی ایک فنکشن رہے گا، پرانا والا ڈیلیٹ کر دیں
function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = 600;
        canvas.height = (img.height * 600) / img.width;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.65));
      }
      img.src = e.target.result;
    }
    reader.readAsDataURL(file);
  });
}

// تصویر منتخب ہوتے ہی چھوٹی ہو جائے
document.getElementById('imageFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('status').innerText = "تصویر تیار ہو رہی ہے...";
  finalFileToUpload = file; // فائل محفوظ
  const pr = document.getElementById('preview');
  pr.src = URL.createObjectURL(file);
  pr.classList.remove('hidden');
  document.getElementById('status').innerText = "تصویر تیار ✅ اب دکان پر لگائیں";
  document.getElementById('status').style.color = "green";
});

// دکان پر لگانے والا بٹن
document.getElementById('addBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  if(!name ||!price ||!finalFileToUpload){ alert("نام، قیمت اور تصویر ضروری ہے"); return; }

  const s = document.getElementById('status');
  s.style.color = "black";
  s.innerText = "اپلوڈ ہو رہا ہے...";

  try{
    const imageUrl = await compressImage(finalFileToUpload);

    await addDoc(collection(db, "products"), {
      name, price,
      brand: document.getElementById('brand').value,
      desc: document.getElementById('desc').value,
      image: imageUrl,
      createdAt: serverTimestamp()
    });

    s.style.color = "green";
    s.innerText = "ماشاءاللہ! دکان پر لگ گیا ✅";
    setTimeout(()=>{ location.href = "shop.html" }, 1000);

  } catch(err){
    s.style.color = "red";
    s.innerText = "ایرر: " + err.message;
  }
});
</script>
