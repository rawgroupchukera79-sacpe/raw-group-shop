<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{font-family:sans-serif;padding:15px}input,textarea{width:100%;padding:12px;margin:6px 0;box-sizing:border-box;border:1px solid orange;border-radius:8px}button{padding:14px;background:black;color:white;width:100%;border:0;margin-top:10px;border-radius:8px}</style></head><body><h3>IJAZ ALI SHOP - Admin</h3><input id="name" placeholder="نام"><input id="price" type="number" placeholder="قیمت"><input id="cat" placeholder="کیٹیگری"><textarea id="detail" placeholder="تفصیل لکھیں"></textarea><input id="img" placeholder="تصویر کا لنک یا logo.png"><button onclick="save()">Save کریں</button><button id="dl" style="display:none;background:green" onclick="download()">⬇️ Download products.js - اسے GitHub پر لگانا لازمی ہے</button><div id="list"></div><script>let products=JSON.parse(localStorage.getItem('my_products')||'[]');function render(){list.innerHTML=products.map((p,i)=>`${i+1}. ${p.name} - ${p.price}<br><small>${p.detail||''}</small><br><br>`).join('');if(products.length)dl.style.display='block'}function save(){let p={id:Date.now(),name:name.value,price:parseInt(price.value),category:cat.value,detail:detail.value,image:img.value||'logo.png'};products.push(p);localStorage.setItem('my_products',JSON.stringify(products));render();alert('Save ہو گیا، اب سبز بٹن دبائیں');}function download(){let code='const products = '+JSON.stringify(products,null,2)+';';let blob=new Blob([code],{type:'text/javascript'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='products.js';a.click()}render();</script></body></html>
