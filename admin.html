<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IJAZ ALI - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<script>
let saved = localStorage.getItem("admin_pass_raw");
if(saved!== "ijaz79"){
  let p = prompt("ایڈمن پاس ورڈ لکھیں:");
  if(p!== "ijaz79"){
    document.write("<h1 style='text-align:center;margin-top:100px;color:red;font-size:30px'>غلط پاس ورڈ</h1>");
    throw new Error("Stop");
  }else{ localStorage.setItem("admin_pass_raw", "ijaz79"); }
}
</script>
<style>
body{font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f3f4f6;}
</style>
</head>
<body>

<!-- نارنجی ہیڈر - بالکل دکان جیسا -->
<div class="bg-orange-500 p-3 shadow" style="background:#FF8C00">
  <div class="flex items-center justify-between max-w-lg mx-auto" dir="ltr">
    <div class="flex items-center gap-2">
      <img src="logo.png" class="w-11 h-11 bg-white rounded-full p-1 border-2 border-white object-contain" onerror="this.src='https://cdn-icons-png.flaticon.com/512/25/25694.png'">
      <div class="text-white leading-none text-left">
        <h1 class="font-extrabold text-lg" style="font-size:18px">IJAZ ALI</h1>
        <p class="text-xs mt-1" style="font-size:11px">R.A.W GROUP CHAKERA</p>
      </div>
    </div>
    <img src="ejaz.jpg" class="w-11 h-11 rounded-full border-2 border-white object-cover" onerror="this.src='logo.png'">
  </div>
</div>

<div class="max-w-lg mx-auto p-4">
  <div class="bg-white rounded-2xl p-5 shadow-md mt-4 border-t-4" style="border-color:#FF8C00">
    <h2 class="text-center font-bold text-2xl mb-5">نیا پروڈکٹ ڈالیں</h2>

    <input id="name" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center outline-none focus:border-orange-400" placeholder="نام - Shows">
    <input id="price" type="number" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center outline-none focus:border-orange-400" placeholder="قیمت - 600">
    <input id="brand" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center outline-none focus:border-orange-400" placeholder="تھان / برانڈ - Bata">
    <textarea id="desc" rows="3" class="w-full border-2 border-gray-200 rounded-xl p-3 mb-3 text-center outline-none focus:border-orange-400" placeholder="تفصیل - Coming soon"></textarea>

    <label class="w-full bg-gray-200 rounded-xl p-3 mb-3 flex justify-center items-center cursor-pointer font-bold gap-2">
      <span>📁 Choose File - فائل منتخب کریں</span>
      <input type="file" id="imageFile" accept="image/*" hidden>
    </label>

    <img id="preview" class="w-full h-56 object-cover rounded-xl hidden mb-3 border">

    <button id="addBtn" class="w-full text-white font-bold p-3.5 rounded-xl text-lg shadow" style="background:#FF8C00">Add Product - دکان پر لگائیں</button>
    <p id="status" class="text-center mt-3 font-bold text-green-600"></p>
    <a href="shop.html" class="block text-center mt-4 font-bold" style="color:#FF8C00">← دکان دیکھیں</a>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE",
  authDomain: "raw-group-shop.firebaseapp.com",
  projectId: "raw-group-shop",
  storageBucket: "raw-group-shop.firebasestorage.app",
  messagingSenderId: "488689802066",
  appId: "1:488689802066:web:1437531e15df63e958388b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let selectedFile = null;
document.getElementById('imageFile').addEventListener('change', (e)=>{
  selectedFile = e.target.files[0];
  if(!selectedFile) return;
  const pr = document.getElementById('preview');
  pr.src = URL.createObjectURL(selectedFile);
  pr.classList.remove('hidden');
  document.getElementById('status').innerText = "تصویر تیار ہے ✅ اب Add دبائیں";
});

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  if(!name ||!price ||!selectedFile){ alert("نام، قیمت اور تصویر ضروری ہے"); return; }
  const s = document.getElementById('status');
  s.innerText = "اپلوڈ ہو رہا ہے... انتظار کریں";
  s.style.color="black";
  try{
    const storageRef = ref(storage, 'products/' + Date.now() + '_' + selectedFile.name);
    await uploadBytes(storageRef, selectedFile);
    const imageUrl = await getDownloadURL(storageRef);
    await addDoc(collection(db,"products"),{
      name: name, price: price,
      brand: document.getElementById('brand').value,
      desc: document.getElementById('desc').value,
      image: imageUrl, createdAt: serverTimestamp()
    });
    s.style.color="green";
    s.innerText = "ماشاءاللہ! دکان پر لگ گیا ✅";
    setTimeout(()=>{ location.href="shop.html" }, 1200);
  }catch(err){
    s.style.color="red";
    s.innerText = "ایرر: " + err.message;
    alert("Storage Rule Allow کریں: Firebase > Storage > Rules میں allow read, write: if true کریں");
  }
});
</script>
</body>
</html>
