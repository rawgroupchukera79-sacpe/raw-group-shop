<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.A.W GROUP - Secure Admin Panel & Commission Tracker</title>
<style>
*{box-sizing:border-box;}
:root{ --orange:#FF8C00; }
body{background:#f5f5f5; font-family:sans-serif; margin:0; padding:10px;}
.box{max-width:550px; margin:15px auto; background:white; border:3px solid var(--orange); border-radius:18px; padding:18px; overflow:hidden; position:relative;}
.logo-box{width:90px; height:90px; margin:0 auto 10px auto; border:3px solid var(--orange); border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:white;}
.logo-box img{width:100%; height:100%; object-fit:cover;}
h1{color:var(--orange); text-align:center; font-size:22px; margin:5px 0;}
input,select,textarea{width:100%; padding:12px; margin:6px 0; border:2px solid var(--orange); border-radius:10px; font-size:16px; display:block;}
.btn-add{width:100%; padding:14px; background:var(--orange); color:white; border:none; border-radius:10px; font-weight:bold; font-size:18px; cursor:pointer;}
.btn-logout{position:absolute; top:12px; left:12px; background:#ff1a1a; color:white; border:none; padding:7px 14px; border-radius:8px; cursor:pointer; font-weight:bold;}
.order-card{border:2px solid #194376; background:#eef2f7; border-radius:10px; padding:10px; margin-bottom:10px; font-size:12px;}
.profit-badge{background:#28a745; color:white; padding:3px 8px; border-radius:4px; font-weight:bold;}
</style>
</head>
<body>

<div class="box" id="loginBox" style="text-align:center;">
  <div class="logo-box"><img src="logo.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'"></div>
  <h1>Admin Login</h1>
  <input type="password" id="adminPass" placeholder="1234" style="text-align:center;">
  <button class="btn-add" id="loginBtn" type="button">لاگ ان کریں</button>
  <p id="loginError" style="color:red; font-weight:bold;"></p>
</div>

<div class="box" id="adminPanel" style="display:none;">
  <button class="btn-logout" id="logoutBtn" type="button">لاگ آؤٹ</button>
  <div class="logo-box"><img src="logo.png" onerror="this.src='https://i.imgur.com/8Km9tLL.png'"></div>
  <h1>R.A.W GROUP ADMIN & PROFIT DASHBOARD</h1>

  <a href="index.html" target="_blank" style="display:block; text-align:center; background:#194376; color:white; padding:10px; border-radius:8px; text-decoration:none; margin-bottom:12px; font-weight:bold;">🛍️ Shop Dekhen - دکان دیکھیں</a>

  <div style="background:#fff3ec; border:2px dashed #f57224; padding:10px; border-radius:10px; margin-bottom:15px; text-align:center;">
    <h3 style="color:#194376; font-size:14px;">📊 Customer Orders & Platform Commission Tracker</h3>
    <div id="ordersList" style="margin-top:10px; text-align:right;">لوڈ ہو رہا ہے...</div>
  </div>
</div>

<script>
const CORRECT_PASS="1234";
const loginBox=document.getElementById('loginBox'), adminPanel=document.getElementById('adminPanel');
function doLogin(){ 
  let p=document.getElementById('adminPass').value.trim(); 
  if(p===CORRECT_PASS){
    sessionStorage.setItem('raw_logged_in','true'); 
    loginBox.style.display='none'; 
    adminPanel.style.display='block';
    loadOrders();
  } else {
    document.getElementById('loginError').innerText='غلط پاس ورڈ! 1234 لکھیں';
  } 
}
document.getElementById('loginBtn').addEventListener('click',doLogin);
document.getElementById('adminPass').addEventListener('keypress',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('logoutBtn').addEventListener('click',()=>{
  sessionStorage.removeItem('raw_logged_in'); 
  adminPanel.style.display='none'; 
  loginBox.style.display='block';
});
if(sessionStorage.getItem('raw_logged_in')==='true'){loginBox.style.display='none'; adminPanel.style.display='block';}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE", authDomain: "raw-group-shop.firebaseapp.com", projectId: "raw-group-shop", storageBucket: "raw-group-shop.firebasestorage.app", messagingSenderId: "488689802066", appId: "1:488689802066:web:1437531e15df63e958388b" };
const app = initializeApp(firebaseConfig); 
const db = getFirestore(app);

window.loadOrders = async function() {
  const container = document.getElementById('ordersList');
  try {
    const snap = await getDocs(collection(db, "orders"));
    if(snap.empty) {
      container.innerHTML = "<p style='text-align:center; color:#666;'>Abhi tak koi new order nahi aaya.</p>";
      return;
    }
    container.innerHTML = "";
    snap.forEach((docSnap) => {
      const o = docSnap.data();
      container.innerHTML += `
        <div class="order-card">
          <h4>📦 Product: ${o.productName}</h4>
          <p>💰 Price: Rs. ${o.productPrice} | <span class="profit-badge">R.A.W Commission (5%): Rs. ${o.adminCommission}</span></p>
          <p>👤 Customer: ${o.customerName} (${o.customerMobile})</p>
          <p>📍 Address: ${o.customerAddress}</p>
          <p>💳 Payment Method: ${o.paymentMethod || 'COD'}</p>
          <p>🏷️ Seller: ${o.sellerName} (${o.sellerMobile})</p>
        </div>
      `;
    });
  } catch(e) {
    container.innerHTML = "Orders load karne mein masla hua.";
  }
};
</script>
</body>
</html>
