<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAW GROUP Admin</title>
<style>
body{font-family:sans-serif; padding:20px; background:#f5f5f5}
input,textarea,button{width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #ccc; font-size:16px}
button{background:black; color:white; font-weight:bold}
img{max-width:200px; margin-top:10px; border-radius:10px}
.hidden{display:none}
</style>
</head>
<body>
<h2>نیا جوتا ایڈ کریں</h2>
<input id="name" placeholder="جوتے کا نام">
<input id="price" type="number" placeholder="قیمت">
<input id="brand" placeholder="برانڈ">
<textarea id="desc" placeholder="تفصیل"></textarea>
<input id="imageFile" type="file" accept="image/*">
<img id="preview" class="hidden">
<div id="status"></div>
<button id="addBtn">دکان پر لگائیں</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "raw-group-shop.firebaseapp.com",
  projectId: "raw-group-shop",
  storageBucket: "raw-group-shop.appspot.com",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let finalFileToUpload = null;

function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = 600;
        canvas.height = (img.height * 600) / img.width;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.65));
      }
      img.src = e.target.result;
    }
    reader.readAsDataURL(file);
  });
}

document.getElementById('imageFile').addEventListener('change', (e)=>{
  finalFileToUpload = e.target.files[0];
  if(!finalFileToUpload) return;
  const pr = document.getElementById('preview');
  pr.src = URL.createObjectURL(finalFileToUpload);
  pr.classList.remove('hidden');
  document.getElementById('status').innerText = "تصویر تیار ہے ✅";
});

document.getElementById('addBtn').addEventListener('click', async ()=>{
  const name = document.getElementById('name').value;
  const price = document.getElementById('price').value;
  if(!name ||!price ||!finalFileToUpload){ alert("نام، قیمت، تصویر لازمی ہے"); return; }
  const s = document.getElementById('status');
  s.innerText = "اپلوڈ ہو رہا ہے...";
  try{
    const imageUrl = await compressImage(finalFileToUpload);
    await addDoc(collection(db,"products"),{
      name, price,
      brand: document.getElementById('brand').value,
      desc: document.getElementById('desc').value,
      image: imageUrl,
      createdAt: serverTimestamp()
    });
    s.innerText = "ماشاءاللہ دکان پر لگ گیا ✅";
    setTimeout(()=> location.href="shop.html", 1000);
  }catch(err){ s.innerText = "ایرر: "+err.message; }
});
</script>
</body>
</html>
