<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - IJAZ ALI</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
<h2 class="text-xl font-bold mb-4 text-center">IJAZ ALI - نیا جوتا ڈالیں</h2>

<input id="name" type="text" placeholder="جوتے کا نام مثلاً Shah Peshawari" class="w-full border p-2 rounded mb-3">
<input id="price" type="number" placeholder="قیمت مثلاً 4500" class="w-full border p-2 rounded mb-3">

<!-- یہ رہا تصویر اپلوڈ والا بٹن -->
<label class="block bg-gray-200 p-3 rounded text-center mb-3 cursor-pointer">
  📸 تصویر منتخب کریں (گیلری سے)
  <input id="file" type="file" accept="image/*" class="hidden">
</label>
<img id="preview" class="w-full h-40 object-cover rounded mb-3 hidden">

<p id="status" class="text-center text-sm text-gray-500 mb-3"></p>

<button id="btn" onclick="addProduct()" class="w-full bg-orange-400 text-white py-3 rounded font-bold">Add Product - دکان پر لگائیں</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSy...apni wali",
  authDomain: "raw-group-shop.firebaseapp.com",
  projectId: "raw-group-shop",
  storageBucket: "raw-group-shop.appspot.com",
  messagingSenderId: "...",
  appId: "..."
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

let selectedFile = null;
document.getElementById("file").addEventListener("change", (e)=>{
  selectedFile = e.target.files[0];
  const preview = document.getElementById("preview");
  preview.src = URL.createObjectURL(selectedFile);
  preview.classList.remove("hidden");
  document.getElementById("status").innerText = "تصویر منتخب ہو گئی: " + selectedFile.name;
});

window.addProduct = async function(){
  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  const status = document.getElementById("status");
  const btn = document.getElementById("btn");

  if(!name ||!price ||!selectedFile){
    alert("نام، قیمت اور تصویر تینوں ضروری ہیں");
    return;
  }

  btn.innerText = "اپلوڈ ہو رہا ہے...";
  btn.disabled = true;
  status.innerText = "تصویر اپلوڈ ہو رہی ہے...";

  try {
    // 1. تصویر Storage پر اپلوڈ
    const storageRef = ref(storage, 'products/' + Date.now() + '_' + selectedFile.name);
    await uploadBytes(storageRef, selectedFile);
    const imageUrl = await getDownloadURL(storageRef);

    // 2. Firestore میں Save
    status.innerText = "دکان پر لگایا جا رہا ہے...";
    await addDoc(collection(db, "products"), {
      name: name,
      price: price,
      image: imageUrl,
      createdAt: Date.now()
    });

    status.innerText = "✅ ہو گیا! دکان پر آ گیا";
    btn.innerText = "Add Product - دکان پر لگائیں";
    btn.disabled = false;
    alert("ماشاءاللہ پروڈکٹ دکان پر لگ گیا!");
  } catch (e) {
    console.error(e);
    alert("Error: " + e.message);
    status.innerText = "Error: " + e.message;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
