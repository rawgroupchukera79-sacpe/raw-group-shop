<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R.A.W GROUP - Admin Panel</title>
<style>
:root{ --orange:#FF8C00; }
body{background:#f2f2f2; font-family:sans-serif; margin:0; padding:12px;}
.box{
  max-width:500px; margin:15px auto; background:white;
  border:3px solid var(--orange);
  border-radius:18px; padding:18px;
  box-shadow: 0 0 0 4px white, 0 0 0 7px var(--orange);
}
.logo-box{
  width:85px; height:85px; margin:0 auto 10px auto;
  border:3px solid var(--orange); border-radius:50%; overflow:hidden;
  display:flex; align-items:center; justify-content:center; background:white;
}
.logo-box img{width:100%; height:100%; object-fit:cover;}
h1{color:var(--orange); text-align:center; font-size:24px; margin:8px 0 15px 0;}
input,select,textarea{
  width:100%; padding:12px; margin:6px 0; box-sizing:border-box;
  border:2px solid var(--orange); border-radius:10px; font-size:16px; outline:none; background:white;
}
button{cursor:pointer;}
.btn-add{
  width:100%; padding:14px; background:var(--orange); color:white;
  border:2px solid var(--orange); border-radius:10px; font-weight:bold; font-size:18px; margin-top:8px;
}
.btn-add:disabled{opacity:0.6}
.btn-logout{
  background:#ff1a1a; color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:bold; float:left; font-size:14px;
}
#status{text-align:center; margin-top:8px; font-weight:bold; color:green; border:1px dashed var(--orange); padding:7px; border-radius:8px;}
#preview-container{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
#preview-container img{width:70px; height:70px; object-fit:cover; border-radius:8px; border:2px solid var(--orange);}
hr{border:none; border-top:2px dashed var(--orange); margin:20px 0;}
h2{color:#111; text-align:center; font-size:20px; margin:0 0 10px 0;}
.product-item{
  display:flex; gap:10px; align-items:center;
  border:2px solid var(--orange); border-radius:12px; padding:8px; margin-bottom:10px; background:#fffaf3;
}
.product-item img{width:65px; height:65px; object-fit:cover; border-radius:8px; border:1px solid var(--orange);}
.p-info{flex:1; text-align:right; font-size:14px;}
.p-info b{font-size:15px; display:block;}
.btn-del{background:#ff1a1a; color:white; border:none; padding:8px 12px; border-radius:8px; font-weight:bold;}
.price-box{display:flex; gap:8px;}
.price-box input{flex:1;}
#pkrPreview{text-align:center; font-size:13px; color:#555; margin-bottom:6px; font-weight:bold;}
</style>
</head>
<body>

<!-- Login Screen -->
<div class="box" id="loginBox" style="text-align:center;">
  <div class="logo-box"><b style="color:var(--orange)">R.A.W</b></div>
  <h1>Admin Login</h1>
  <p>پینل کھولنے کے لیے پاس ورڈ درج کریں</p>
  <input type="password" id="adminPass" placeholder="پاس ورڈ (مثال: 1234)">
  <button class="btn-add" id="loginBtn">لاگ ان کریں</button>
  <p id="loginError" style="color:red; margin-top:8px; font-weight:bold;"></p>
</div>

<!-- Main Admin Panel -->
<div class="box" id="adminPanel" style="display:none;">
  <button class="btn-logout" id="logoutBtn">لاگ آؤٹ 🔒</button>
  <div class="logo-box" style="clear:both;"><img src="logo.png" onerror="this.parentElement.innerHTML='<b style=color:var(--orange)>R.A.W</b>'"></div>
  <h1>R.A.W GROUP - Admin Panel</h1>

  <select id="category">
    <option value="Shoes">👟 جوتے - Shoes</option>
    <option value="Clothes">👕 کپڑے - Clothes</option>
    <option value="Watches">⌚ گھڑیاں - Watches</option>
    <option value="Perfume">🧴 پرفیوم - Perfume</option>
    <option value="Other">📦 دیگر - Other</option>
  </select>
  <input id="name" placeholder="پروڈکٹ کا نام *">
  <input id="brand" placeholder="برانڈ (مثال: Nike)">
  
  <div class="price-box">
    <input id="priceUSD" type="number" step="0.01" placeholder="قیمت ڈالر میں ($) *">
    <input id="ratePKR" type="number" value="280" placeholder="ڈالر ریٹ PKR">
  </div>
  <div id="pkrPreview">پاکستانی روپے میں تخمینہ: Rs. 0</div>

  <input id="affiliateLink" placeholder="ایمیزون پروڈکٹ کا لنک (Amazon URL)">
  <textarea id="desc" rows="2" placeholder="تفصیل"></textarea>
  
  <input id="imageFile" type="file" accept="image/*" multiple>
  <div id="preview-container"></div>
  
  <div id="status">تصاویر منتخب کریں (زیادہ سے زیادہ 4-5)</div>
  <button class="btn-add" id="addBtn">پروڈکٹ سیو کریں</button>
  <a href="index.html" style="display:block; text-align:center; margin-top:10px; text-decoration:none; color:var(--orange); font-weight:bold; border:2px solid var(--orange); padding:8px; border-radius:8px;">← دکان دیکھیں</a>

  <hr>
  <h2>موجودہ پروڈکٹس (ڈیلیٹ کریں)</h2>
  <div id="productList">لوڈ ہو رہا ہے...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, serverTimestamp, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCV4SuTz7SOhWMkTHEefzCAnQ1DhyMn7wE",
  authDomain: "raw-group-shop.firebaseapp.com",
  projectId: "raw-group-shop",
  storageBucket: "raw-group-shop.firebasestorage.app",
  messagingSenderId: "488689802066",
  appId: "1:488689802066:web:1437531e15df63e958388b"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const AMAZON_TAG = "rawgroup79-20";

// Login Logic (Default password is '1234', you can change it here)
const CORRECT_PASS = "1234";
const loginBox = document.getElementById('loginBox');
const adminPanel = document.getElementById('adminPanel');

if(sessionStorage.getItem('raw_logged_in') === 'true') {
  loginBox.style.display = 'none';
  adminPanel.style.display = 'block';
  loadProducts();
}

document.getElementById('loginBtn').addEventListener('click', () => {
  const p = document.getElementById('adminPass').value;
  if(p === CORRECT_PASS) {
    sessionStorage.setItem('raw_logged_in', 'true');
    loginBox.style.display = 'none';
    adminPanel.style.display = 'block';
    loadProducts();
  } else {
    document.getElementById('loginError').innerText = 'غلط پاس ورڈ! دوبارہ کوشش کریں۔';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  sessionStorage.removeItem('raw_logged_in');
  adminPanel.style.display = 'none';
  loginBox.style.display = 'block';
  document.getElementById('adminPass').value = '';
});

// Price conversion live calculation
const priceUSD = document.getElementById('priceUSD');
const ratePKR = document.getElementById('ratePKR');
const pkrPreview = document.getElementById('pkrPreview');

function updatePKR() {
  let usd = parseFloat(priceUSD.value) || 0;
  let rate = parseFloat(ratePKR.value) || 0;
  let pkr = Math.round(usd * rate);
  pkrPreview.innerText = `پاکستانی روپے میں تخمینہ: Rs. ${pkr.toLocaleString()} (ڈالر ریٹ: ${rate})`;
}
priceUSD.addEventListener('input', updatePKR);
ratePKR.addEventListener('input', updatePKR);

let selectedFiles = [];
function compress(f){return new Promise(r=>{const rd=new FileReader();rd.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const w=400;c.width=w;c.height=(im.height*w)/im.width;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',0.5));};im.src=e.target.result;};rd.readAsDataURL(f);});}

const status=document.getElementById('status');
const listDiv=document.getElementById('productList');
const previewContainer = document.getElementById('preview-container');

document.getElementById('imageFile').addEventListener('change', e => {
 selectedFiles = Array.from(e.target.files);
 previewContainer.innerHTML = ''; 
 
 if(selectedFiles.length === 0) {
   status.innerText = 'تصاویر منتخب کریں (زیادہ سے زیادہ 4-5)';
   return;
 }
 
 selectedFiles.forEach(file => {
   const reader = new FileReader();
   reader.onload = function(event) {
     const img = document.createElement('img');
     img.src = event.target.result;
     previewContainer.appendChild(img);
   }
   reader.readAsDataURL(file);
 });

 status.innerText = selectedFiles.length + ' تصاویر تیار ✅';
});

document.getElementById('addBtn').addEventListener('click', async () => {
 const name = document.getElementById('name').value.trim();
 const usdVal = document.getElementById('priceUSD').value.trim();
 if(!name || !usdVal || selectedFiles.length === 0){ alert('نام، ڈالر قیمت اور کم از کم ایک تصویر لازمی ہے'); return; }
 
 const btn = document.getElementById('addBtn');
 btn.disabled = true; status.innerText = 'تصاویر کمپریس اور سیو ہو رہی ہیں...';
 
 try{
  let compressedImages = [];
  for(let file of selectedFiles) {
    let base64Img = await compress(file);
    compressedImages.push(base64Img);
  }

  let rawLink = document.getElementById('affiliateLink').value.trim();
  let finalAffiliateLink = "";

  if(rawLink) {
    if(rawLink.includes("?")) {
      finalAffiliateLink = rawLink + "&tag=" + AMAZON_TAG;
    } else {
      finalAffiliateLink = rawLink + "?tag=" + AMAZON_TAG;
    }
  }

  let numericUSD = Number(usdVal);
  let rate = Number(ratePKR.value) || 280;
  let numericPKR = Math.round(numericUSD * rate);

  await addDoc(collection(db,'products'),{
    category: document.getElementById('category').value,
    name, 
    brand: document.getElementById('brand').value || '',
    priceUSD: numericUSD,
    pricePKR: numericPKR,
    price: numericUSD, // Backwards compatibility if needed
    affiliateLink: finalAffiliateLink,
    desc: document.getElementById('desc').value || '',
    images: compressedImages,
    createdAt: serverTimestamp()
  });
  
  status.innerText = 'ماشاءاللہ پروڈکٹ سیو ہو گیا ✅';
  selectedFiles = []; 
  document.getElementById('imageFile').value = '';
  document.getElementById('name').value = ''; 
  document.getElementById('priceUSD').value = ''; 
  document.getElementById('brand').value = ''; 
  document.getElementById('affiliateLink').value = '';
  document.getElementById('desc').value = '';
  pkrPreview.innerText = `پاکستانی روپے میں تخمینہ: Rs. 0`;
  previewContainer.innerHTML = '';
  loadProducts();
 }catch(err){
  status.innerText = 'ایرر: '+err.message; 
  alert(err.message);
 }
 btn.disabled = false; 
 btn.innerText = 'پروڈکٹ سیو کریں';
});

async function loadProducts(){
 listDiv.innerHTML = 'لوڈ ہو رہا ہے...';
 try{
  const q = query(collection(db,'products'), orderBy('createdAt','desc'));
  const snap = __awaiter ? await getDocs(q) : await getDocs(q);
  if(snap.empty){ listDiv.innerHTML = '<p style=text-align:center>کوئی پروڈکٹ نہیں</p>'; return; }
  listDiv.innerHTML = '';
  snap.forEach(d => {
    const p = d.data();
    let mainImg = (p.images && p.images.length > 0) ? p.images[0] : (p.image || 'logo.png');
    let imgCount = p.images ? p.images.length : 1;
    let priceDisplay = p.priceUSD ? `$${p.priceUSD} (Rs. ${p.pricePKR || Math.round(p.priceUSD * 280)})` : `Rs.${p.price}`;
    
    const div = document.createElement('div');
    div.className = 'product-item';
    div.innerHTML = `
      <img src="${mainImg}">
      <div class="p-info"><b>${p.name}</b><span>${p.category} - ${priceDisplay} <br><small>(${imgCount} تصاویر)</small></span></div>
      <button class="btn-del">ڈیلیٹ</button>
    `;
    div.querySelector('.btn-del').addEventListener('click', async () => {
      if(!confirm('کیا آپ واقعی '+p.name+' کو ڈیلیٹ کرنا چاہتے ہیں؟')) return;
      await deleteDoc(doc(db,'products', d.id));
      div.remove();
    });
    listDiv.appendChild(div);
  });
 }catch(e){ listDiv.innerHTML = 'ایرر: '+e.message; }
}
</script>
</body>
</html>
